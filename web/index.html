        return `<button class="card2" data-open="${n.id}"><div class="meta">${icon(t.icon, 's14')}<span class="type">${t.label}</span>${n.badges.includes('star') ? `<span class="star">${icon('star', 'fill s14')}</span>` : ''}</div><div class="title">${esc(n.title || 'Untitled')}</div>${content}${chips(n) ? `<div class="badges" style="margin-top:auto">${chips(n)}</div>` : ''}</button>`;
      }).join('')}</div>`;
    } else if (mode === 'list' || isPhone()) {
      body = `<div class="list">${notes.map((n) => `<div class="lrow" data-open="${n.id}" role="button" tabindex="0"><span class="tt">${icon(TYPES[n.type].icon)}</span><div class="main"><b>${esc(n.title || 'Untitled')}</b><small>${TYPES[n.type].label} · ${esc(subtitle(n))}</small>${isPhone() && chips(n) ? `<div class="cell-badges" style="margin-top:6px">${chips(n)}</div>` : ''}</div>${isPhone() ? '' : `<div class="cell-badges">${chips(n)}</div>`}<button class="ib" data-native="${n.id}" aria-label="Open in ${TYPES[n.type].app}" title="Open in ${TYPES[n.type].app}">${icon('external')}</button></div>`).join('')}</div>`;
    } else {
      body = `<div class="table-wrap"><table class="details"><thead><tr><th>Note</th><th>Badges</th><th>Group</th><th>Opens with</th><th><span class="sr-only">Actions</span></th></tr></thead><tbody>${notes.map((n) => {
        const groups = [...new Set(linksFor(n.id).map((l) => l.group).filter(Boolean))];
        return `<tr data-open="${n.id}"><td><div class="cell-note"><span class="tt">${icon(TYPES[n.type].icon)}</span><div><b>${esc(n.title || 'Untitled')}</b><small>${TYPES[n.type].label} · ${esc(subtitle(n))}</small></div></div></td><td><div class="cell-badges">${chips(n)}</div></td><td>${groups.map((g) => `<span class="gname"><span class="gdot" style="--gc:${gColor(g)}"></span>${esc(g)}</span>`).join('<br/>')}</td><td class="muted" style="color:var(--ink-2)">${TYPES[n.type].app}</td><td style="text-align:right;white-space:nowrap"><button class="ib sm" data-open="${n.id}" aria-label="Quick preview">${icon('eye', 's16')}</button><button class="ib sm" data-native="${n.id}" aria-label="Open in ${TYPES[n.type].app}">${icon('external', 's16')}</button></td></tr>`;
      }).join('')}</tbody></table></div>`;
    }
    $('#structured').innerHTML = `<div class="sv">${head}${body}</div>`;
  }
  /* ------------------------------------------------------------------
     Rendering — Quick Look pop-up and expanded (maximized) note
     ------------------------------------------------------------------ */
  function waveBars(n, count) {
    let s = 7; for (const c of n.id) s = (s * 31 + c.charCodeAt(0)) >>> 0;
    return Array.from({ length: count }, () => { s = (s * 1103515245 + 12345) >>> 0; return 0.22 + (((s >>> 8) % 1000) / 1000) * 0.78; });
  }
  const pad2 = (x) => String(x).padStart(2, '0');

  /** The big, type-specific content area shared by Quick Look and the expanded view. */
  function viewerStage(n, lg) {
    const m = n.meta || {}; const t = TYPES[n.type] || TYPES.text;
    const doc = (ph = 'Write anything…') => `<textarea class="doc" data-vf="body" placeholder="${ph}" aria-label="Note text">${esc(n.body)}</textarea>`;
    const notes = (label = 'Notes', ph = 'Add notes…') => `<section><div class="sec-h">${label}</div><textarea class="field" data-vf="body" placeholder="${ph}" aria-label="${label}">${esc(n.body)}</textarea></section>`;
    const hero = (art, title, sub, extra = '') => `<div class="hero">${art}<div class="grow"><b>${title}</b>${sub ? `<span>${sub}</span>` : ''}</div>${extra}</div>`;
    const bigIcon = (name) => `<span class="hero-ic">${icon(name)}</span>`;
    let html, fill = false;
    switch (n.type) {
      case 'pdf': case 'fileAttachment':
        html = `<div class="spread"><span class="page head"></span><span class="page"></span></div>
          <div class="cap">${m.pages ? `Pages 1–2 of ${esc(m.pages)}` : esc(fileName(n.url) || t.label)}${m.fileSize ? ` · ${esc(m.fileSize)}` : ''}</div>${notes()}`; break;
      case 'video':
        html = `<div class="vid"><button class="big" data-v="play" aria-label="${n.playing ? 'Pause' : 'Play'}">${icon(n.playing ? 'pause' : 'play', 'fill')}</button>
          ${m.duration ? `<span class="dur mono">${esc(m.duration)}</span>` : ''}<div class="scrub"><i style="width:${Math.round((n.progress || 0) * 100)}%"></i></div></div>${notes('Description')}`; break;
      case 'voice': case 'audio': {
        const bars = waveBars(n, lg ? 72 : 56); const played = Math.round(bars.length * (n.playing ? Math.max(n.progress || 0, 0.35) : n.progress || 0));
        html = `<div class="aud"><button class="play" data-v="play" aria-label="${n.playing ? 'Pause' : 'Play'}">${icon(n.playing ? 'pause' : 'play', 'fill')}</button>
          <div class="wave" aria-hidden="true">${bars.map((h, i) => `<i class="${i < played ? 'on' : ''}" style="height:${Math.round(h * 100)}%"></i>`).join('')}</div>
          ${m.duration ? `<span class="mono dur">${esc(m.duration)}</span>` : ''}</div>${notes(n.type === 'voice' ? 'Transcript' : 'Notes', n.type === 'voice' ? 'Add a transcript…' : 'Add notes…')}`; break;
      }
      case 'webPreview':
        html = `<div class="browser"><div class="chrome"><i></i><i></i><i></i><span class="url mono">${esc(n.url || host(n.body) || 'about:blank')}</span></div>
          <div class="page"><span class="bar h"></span><span class="bar"></span><span class="bar"></span><span class="bar" style="width:72%"></span><div class="cells"><i></i><i></i><i></i></div></div></div>
          <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:12.5px">Snapshot v${n.rev || 1} · ${timeAgo(n.refreshedAt || Date.now())}</span><button class="btn ghost" data-v="refresh">${icon('refresh', 's16')}Refresh snapshot</button></div>${notes()}`; break;
      case 'screenClip':
        html = `<div class="clipimg">${icon('image')}${m.dimensions ? `<span class="mono">${esc(m.dimensions)}</span>` : ''}</div>${notes()}`; break;
      case 'drawing':
        html = `<div class="drawbox">${n.scribbles?.length ? `<svg viewBox="0 0 ${n.w} ${n.h}" preserveAspectRatio="xMidYMid meet">${inkLayer(n.scribbles)}</svg>` : `<span class="muted">${icon('pen')}<br/>No ink yet — draw on the note with the Draw tool</span>`}</div>${notes()}`; break;
      case 'checklist': {
        const done = tasksDone(n), total = n.tasks.length;
        html = `<div class="progress"><div class="row" style="justify-content:space-between"><span class="muted">${done} of ${total} done</span><span class="mono muted">${total ? Math.round(done / total * 100) : 0}%</span></div><div class="track"><i style="width:${total ? done / total * 100 : 0}%"></i></div></div>
          <div class="tasks">${n.tasks.map((x, i) => `<label class="vtask ${x.done ? 'done' : ''}"><input type="checkbox" data-vtask="${i}" ${x.done ? 'checked' : ''}/><span>${esc(x.title)}</span></label>`).join('')}</div>
          <label class="newtask">${icon('plus', 's16')}<input data-vnewtask placeholder="Add a task and press Enter" aria-label="New task"/></label>${notes()}`; break;
      }
      case 'calendar': {
        const d = m.date ? new Date(m.date + 'T12:00:00') : null;
        html = hero(d ? `<span class="datebox lg"><small>${d.toLocaleString('en', { month: 'short' }).toUpperCase()}</small><b>${d.getDate()}</b></span>` : bigIcon('calendar'),
          d ? esc(d.toLocaleDateString('en', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })) : 'No date yet', esc(m.time || m.location || '')) + doc('Agenda, people, details…'); break;
      }
      case 'alarm': {
        const tm = ((m.alarmTime || n.title).match(/\d{1,2}:\d{2}/) || [])[0];
        html = hero(tm ? `<span class="bigtime">${tm}</span>` : bigIcon('alarm'), 'Reminder', esc(m.repeat || '')) + doc('What should you remember?'); break;
      }
      case 'invitation': {
        const r = (m.rsvp || '').match(/(\d+)\s*\/\s*(\d+)/);
        html = hero(bigIcon('users'), r ? `${r[1]} of ${r[2]} attending` : 'Invitation', esc(m.date || '')) + doc(); break;
      }
      case 'emailLink': {
        const e = emailOf(n);
        html = hero(`<span class="avatar lg">${esc(initials(e))}</span>`, esc(nameFromEmail(e)), `<span class="mono">${esc(e)}</span>`, `<button class="btn" data-v="open">${icon('mail', 's16')}Write</button>`) + doc('Draft or notes…'); break;
      }
      case 'appShortcut':
        html = hero(bigIcon('zap'), 'App shortcut', `<span class="mono">${esc(n.url || '')}</span>`, `<button class="btn primary" data-v="open">${icon('external', 's16')}Launch</button>`) + doc('How and when to use it…'); break;
      case 'hyperlink': case 'bookmark':
        html = hero(bigIcon(n.type === 'bookmark' ? 'bookmark' : 'globe'), esc(host(n.url) || 'No link yet'), `<span class="mono">${esc(n.url || '')}</span>`, n.url ? `<button class="btn" data-v="open">${icon('external', 's16')}Open link</button>` : '') + doc('Why this link matters…'); break;
      case 'iconStamp':
        html = hero(bigIcon('bulb'), 'Stamp', '') + doc(); break;
      default:
        html = doc(); fill = true;
    }
    return `<div class="vs ${lg ? 'lg' : ''} ${fill ? 'fill' : ''}">${html}</div>`;
  }

  /** Badges, links and details — the side panel of both views. */
  function viewerInfo(n) {
    const t = TYPES[n.type] || TYPES.text;
    const links = linksFor(n.id); const isFile = FILE_TYPES.has(n.type);
    const created = new Date(n.createdAt || Date.now());
    const extraMeta = Object.entries(n.meta || {}).filter(([k]) => !['snapshotStatus'].includes(k));
    return `<div class="pv-actions"><button class="btn primary" data-v="open">${icon('external', 's16')}<span>Open in ${t.app}</span></button>${n.url ? `<button class="btn" data-v="copy">${isFile ? 'Copy path' : 'Copy link'}</button>` : ''}</div>
      <section><div class="sec-h">Badges<button class="btn ghost" data-v="badge-menu" style="height:30px">Add</button></div>
        ${n.badges.length ? `<div class="chips-row">${BADGES.filter((b) => n.badges.includes(b.id)).map((b) => `<span class="chip lg t-${b.tone}">${icon(b.icon, 's14')}${b.label}<button class="x" data-unbadge="${b.id}" aria-label="Remove ${b.label}">${icon('x', 's12')}</button></span>`).join('')}</div>` : '<p class="muted" style="margin:0">No badges yet.</p>'}</section>
      <section><div class="sec-h">Links</div>${links.length ? `<div class="links">${links.map((l) => { const out = l.src === n.id; const o = findNote(out ? l.dst : l.src); return `<button class="linkrow" data-editlink="${l.id}">${icon(out ? 'arrow-r' : 'arrow-l', 's16')}<span class="grow"><b>${esc(o?.title || 'Untitled')}</b>${l.label ? `<small>${esc(l.label)}</small>` : ''}</span><span class="gname" style="font-size:12px"><span class="gdot" style="--gc:${gColor(l.group)}"></span>${esc(l.group)}</span></button>`; }).join('')}</div>` : '<p class="muted" style="margin:0">Not linked yet. Use the link button on the note to connect it.</p>'}</section>
      <section><div class="sec-h">Details</div>
        <input class="field mono" data-vf="url" value="${esc(n.url)}" placeholder="${isFile ? 'File path' : 'Link'}" aria-label="${isFile ? 'File path' : 'Link'}"/>
        <dl class="details"><dt>Desk</dt><dd>${esc(ownerBoard(n.id)?.title || '—')}</dd><dt>Opens with</dt><dd>${t.app}</dd><dt>Added</dt><dd>${created.getFullYear()}-${pad2(created.getMonth() + 1)}-${pad2(created.getDate())} ${pad2(created.getHours())}:${pad2(created.getMinutes())}</dd>${extraMeta.map(([k, v]) => `<dt>${esc(k.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, (c) => c.toUpperCase()))}</dt><dd>${esc(v)}</dd>`).join('')}</dl></section>`;
  }

  function browseList() { const b = activeBoard(); const l = visibleNotes(b); return l.length ? l : b.notes; }

  function qlHtml(n) {
    const t = TYPES[n.type] || TYPES.text; const compact = isPhone();
    const list = browseList(); const i = list.findIndex((x) => x.id === n.id);
    return `<div class="ql-bar">
        <button class="ib" data-v="close" aria-label="Close Quick Look" title="Close (Space)">${icon('x')}</button>
        ${compact ? '' : `<button class="ib" data-v="prev" aria-label="Previous note" title="Previous (←)">${icon('chev-l')}</button><button class="ib" data-v="next" aria-label="Next note" title="Next (→)">${icon('chev-r')}</button>`}
        <div class="ttl">${icon(t.icon, 's16')}<input class="title-in" data-vf="title" value="${esc(n.title)}" placeholder="Untitled" aria-label="Title"/></div>
        ${compact ? '' : `<button class="btn" data-v="open">${icon('external', 's16')}<span>Open with ${t.app}</span></button>
        <button class="ib" data-v="info" aria-pressed="${!!S.qlInfo}" aria-label="${S.qlInfo ? 'Hide info' : 'Show info'}" title="${S.qlInfo ? 'Hide info (I)' : 'Show info (I)'}">${icon('info')}</button>`}
        <button class="ib" data-v="max" aria-label="Expand to canvas" title="Expand to canvas (F)">${icon('expand')}</button>
      </div>
      <div class="v-main"><div class="v-stage">${viewerStage(n, false)}${compact ? `<div class="v-info inline">${viewerInfo(n)}</div>` : ''}</div>${!compact && S.qlInfo ? `<aside class="v-info" aria-label="Note info">${viewerInfo(n)}</aside>` : ''}</div>
      ${compact ? '' : `<div class="ql-foot"><span><kbd>←</kbd> <kbd>→</kbd> browse · <kbd>Space</kbd> close · <kbd>F</kbd> expand to canvas</span><span class="mono">${i >= 0 ? `${i + 1} of ${list.length}` : ''}</span></div>`}`;
  }

  function maxHtml(n) {
    const t = TYPES[n.type] || TYPES.text; const compact = isPhone();
    const chips = n.badges.filter((b) => B[b]?.kind === 'chip').slice(0, 3);
    return `<div class="mv-inner"><header class="mv-head">
        <button class="btn ghost back" data-v="restore" aria-label="Back to desk" title="Back to the desk (Esc)">${icon('collapse', 's18')}<span>${compact ? 'Back' : 'Back to desk'}</span></button>
        <div class="vdiv" style="height:24px"></div>
        <span class="mv-type">${icon(t.icon, 's18')}</span>
        <input class="title-in big" data-vf="title" value="${esc(n.title)}" placeholder="Untitled" aria-label="Title"/>
        ${compact ? '' : `<span class="chips-row">${chips.map((c) => chipHtml(c)).join('')}</span>`}
        <button class="ib" data-v="ql" aria-label="Quick Look" title="Quick Look (Space)">${icon('eye')}</button>
        ${compact ? `<button class="ib" data-v="open" aria-label="Open in ${t.app}">${icon('external')}</button>` : ''}
        <button class="ib danger" data-v="delete" aria-label="Delete note" title="Delete note">${icon('trash')}</button>
      </header>
      <div class="v-main"><div class="v-stage">${viewerStage(n, true)}${compact ? `<div class="v-info inline">${viewerInfo(n)}</div>` : ''}</div>${compact ? '' : `<aside class="v-info" aria-label="Note info">${viewerInfo(n)}</aside>`}</div></div>`;
  }

  /** Re-renders a viewer in place, keeping focus, caret and scroll position. */
  function patchViewer(root, html) {
    const a = document.activeElement; const inside = a && root.contains(a);
    const key = inside ? (a.dataset.vf ? `[data-vf="${a.dataset.vf}"]` : a.dataset.vtask ? `[data-vtask="${a.dataset.vtask}"]` : a.hasAttribute('data-vnewtask') ? '[data-vnewtask]' : a.dataset.v ? `[data-v="${a.dataset.v}"]` : null) : null;
    const sel = inside && 'selectionStart' in a ? [a.selectionStart, a.selectionEnd] : null;
    const scrolls = $$('.v-stage, .v-info', root).map((x) => x.scrollTop);
    root.innerHTML = html;
    $$('.v-stage, .v-info', root).forEach((x, i) => { x.scrollTop = scrolls[i] || 0; });
    if (inside) {
      const el = key && $(key, root);
      if (el) { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch { /* not a text field */ } }
      else root.focus({ preventScroll: true });
    }
  }

  function renderViewers() {
    const qn = S.previewId ? findNote(S.previewId) : null;
    if (!qn) S.previewId = null;
    const layer = $('#ql-layer'), ql = $('#ql');
    if (qn) { ql.classList.toggle('info', !!S.qlInfo && !isPhone()); ql.setAttribute('aria-label', `Quick Look: ${qn.title || 'Untitled'}`); patchViewer(ql, qlHtml(qn)); layer.hidden = false; }
    else if (!VIEW.qlClosing) { layer.hidden = true; ql.innerHTML = ''; }
    const mn = S.maxId ? findNote(S.maxId) : null;
    if (!mn) S.maxId = null;
    const mv = $('#maxview');
    if (mn) { mv.setAttribute('aria-label', `Expanded note: ${mn.title || 'Untitled'}`); patchViewer(mv, maxHtml(mn)); mv.hidden = false; }
    else if (!VIEW.maxClosing) { mv.hidden = true; mv.innerHTML = ''; }
    document.body.classList.toggle('has-max', !!mn);
  }

  /* ------------------------------------------------------------------
     Toast, menus, dialogs
     ------------------------------------------------------------------ */
  let toastTimer = 0;
  function toast(msg, undoable = false) {
    const t = $('#toast');
    $('#toast-msg').textContent = msg;
    $('#toast-act').hidden = !undoable;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
  }

  let menuClose = null;
  function showMenu(anchor, items) {
    const m = $('#menu');
    m.innerHTML = items.map((it, i) => it.sep ? '<div class="sep"></div>' : it.lbl ? `<div class="lbl">${esc(it.lbl)}</div>` :
      `<button role="${it.checked === undefined ? 'menuitem' : 'menuitemcheckbox'}" data-i="${i}" ${it.checked !== undefined ? `aria-checked="${it.checked}"` : ''} ${it.disabled ? 'disabled style="opacity:.5"' : ''}>${it.icon ? icon(it.icon, 's16') : ''}<span>${esc(it.label)}</span>${it.hint ? `<span class="mono" style="margin-left:auto;font-size:11px;color:var(--ink-3)">${esc(it.hint)}</span>` : ''}</button>`).join('');
    m.classList.add('show');
    const r = anchor.getBoundingClientRect();
    const mw = m.offsetWidth, mh = m.offsetHeight;
    m.style.left = clamp(r.left, 8, innerWidth - mw - 8) + 'px';
    m.style.top = (r.bottom + 6 + mh > innerHeight ? Math.max(8, r.top - mh - 6) : r.bottom + 6) + 'px';
    const first = m.querySelector('button:not([disabled])'); first?.focus();
    const onClick = (e) => {
      const b = e.target.closest('button[data-i]');
      if (b && m.contains(b)) { const it = items[+b.dataset.i]; close(); it.action?.(); return; }
      if (!m.contains(e.target)) close();
    };
    const onKey = (e) => {
      const btns = $$('button:not([disabled])', m); const i = btns.indexOf(document.activeElement);
      if (e.key === 'Escape') { e.preventDefault(); close(); anchor.focus(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); btns[(i + 1) % btns.length]?.focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); btns[(i - 1 + btns.length) % btns.length]?.focus(); }
    };
    function close() { m.classList.remove('show'); document.removeEventListener('pointerdown', onClick, true); document.removeEventListener('keydown', onKey, true); menuClose = null; }
    menuClose?.();
    setTimeout(() => { document.addEventListener('pointerdown', onClick, true); document.addEventListener('keydown', onKey, true); });
    menuClose = close;
  }

  function openDialog(html, mount) {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog" class="dlg">${html}</form>`;
    d.showModal();
    mount?.(d);
    d.querySelector('[autofocus]')?.focus();
    return d;
  }
  function promptText(title, label, initial = '', action = 'Save', hint = '') {
    return new Promise((resolve) => {
      const d = openDialog(`<h2>${esc(title)}</h2><label>${esc(label)}<input class="field" name="v" value="${esc(initial)}" placeholder="${esc(hint)}" autofocus/></label>
        <div class="actions"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">${esc(action)}</button></div>`);
      d.addEventListener('close', () => resolve(d.returnValue === 'ok' ? d.querySelector('[name=v]').value.trim() : null), { once: true });
    });
  }
  function confirmDialog(title, msg, action = 'OK', danger = false) {
    return new Promise((resolve) => {
      const d = openDialog(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="actions"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok" style="${danger ? 'background:var(--danger);border-color:var(--danger)' : ''}" autofocus>${esc(action)}</button></div>`);
      d.addEventListener('close', () => resolve(d.returnValue === 'ok'), { once: true });
    });
  }

  function linkDialog(src) {
    const n = findNote(src);
    const others = activeBoard().notes.filter((x) => x.id !== src);
    if (!others.length) { toast('Add another note to this desk to link it'); return; }
    const d = openDialog(`<h2>Link “${esc(n.title || 'Untitled')}”</h2>
      <p>Linked notes in the same group also appear together on that group’s canvas.</p>
      <label>Link to<select class="field" name="dst">${others.map((o) => `<option value="${o.id}">${esc(TYPES[o.type].label)} · ${esc(o.title || 'Untitled')}</option>`).join('')}</select></label>
      <label>Group<input class="field" name="group" value="${esc(S.linkGroup)}" autofocus/></label>
      <div class="chips-row">${groupNames().map((g) => `<button type="button" class="pick" data-g="${esc(g)}"><span class="gdot" style="--gc:${gColor(g)}"></span>${esc(g)}</button>`).join('')}</div>
      <label>Label (optional)<input class="field" name="label" placeholder="e.g. blocks, supports, follow-up"/></label>
      <div class="actions"><button class="btn" value="cancel">Cancel</button><button class="btn primary" value="ok">Link</button></div>`, (dl) => {
      dl.querySelectorAll('[data-g]').forEach((b) => b.addEventListener('click', () => { dl.querySelector('[name=group]').value = b.dataset.g; }));
    });
    d.addEventListener('close', () => {
      if (d.returnValue !== 'ok') return;
      createLink(src, d.querySelector('[name=dst]').value, d.querySelector('[name=group]').value, d.querySelector('[name=label]').value.trim());
    }, { once: true });
  }
  function editLinkDialog(id) {
    let link, board;
    for (const b of S.boards) { const l = b.links.find((x) => x.id === id); if (l) { link = l; board = b; } }

    $('#ql .v-main')?.animate([{ opacity: 0.25, transform: `translateX(${dir * 18}px)` }, { opacity: 1, transform: 'none' }], { duration: reducedMotion() ? 1 : 180, easing: EASE_OUT });
  }

  /** CSS inset() that clips the workspace down to rect r. */
  function insetFor(r) {
    const ws = $('#workspace').getBoundingClientRect();
    if (!r) { const ix = ws.width * 0.2, iy = ws.height * 0.2; return `inset(${iy}px ${ix}px ${iy}px ${ix}px round 12px)`; }
    const f = (v) => Math.max(0, v).toFixed(1) + 'px';

  }
  function maximize(id) {
    if (!findNote(id)) return;
    if (S.editingId) commitEdit();
    let origin = noteScreenRect(id);
    if (S.previewId) { origin = $('#ql').getBoundingClientRect(); closePreview({ instant: true, refocus: false }); }
    VIEW.maxClosing = false;
    S.maxId = id; S.sel = id;
    renderAll();
    const mv = $('#maxview'); stopAnims(mv);
    const d = reducedMotion() ? 1 : 340;
    mv.animate([{ clipPath: insetFor(origin) }, { clipPath: 'inset(0px 0px 0px 0px round 0px)' }], { duration: d, easing: EASE_OUT });
    $('.mv-inner', mv)?.animate([{ opacity: 0.4 }, { opacity: 1 }], { duration: d * 0.7, easing: 'ease-out' });
    $('[data-v="restore"]', mv)?.focus({ preventScroll: true });
  }
  function restoreMax() {
    const id = S.maxId; if (!id || VIEW.maxClosing) return;
    const mv = $('#maxview');
    const done = () => {
      VIEW.maxClosing = false; stopAnims(mv);
      S.maxId = null; renderAll();
      $(`.note[data-id="${id}"]`)?.focus({ preventScroll: true });
    };
    if (reducedMotion()) { done(); return; }
    VIEW.maxClosing = true;
    const a = mv.animate([{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: insetFor(noteScreenRect(id)) }], { duration: 260, easing: 'cubic-bezier(.4,0,.2,1)', fill: 'forwards' });
    $('.mv-inner', mv)?.animate([{ opacity: 1 }, { opacity: 0.3 }], { duration: 260, fill: 'forwards' });
    a.finished.then(done, done);
  }
  /** Keeps Tab inside a modal. */
  function trapTab(e, root) {
    const f = $$('button:not([disabled]), input, textarea, select, [tabindex="0"]', root).filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1], a = document.activeElement;

  }
  function toggleTidy() {
    const b = activeBoard(); if (b.isGroup) return;

    if (!b.tidy) {
      const cols = Math.max(1, Math.min(5, Math.floor((vpEl.clientWidth - 80) / 300)));
      b.notes.forEach((n, i) => { n.saved = { x: n.x, y: n.y, w: n.w, h: n.h }; n.x = 56 + (i % cols) * 300; n.y = 48 + Math.floor(i / cols) * 220; n.w = 270; n.h = 190; });
      b.tidy = true;
    } else {
      b.notes.forEach((n) => { if (n.saved) Object.assign(n, n.saved); delete n.saved; });
      b.tidy = false;
    }
    renderAll();
  }

  $('#tabs').addEventListener('click', (e) => {
    if (e.target.closest('#new-desk')) { newDesk(); return; }

  });
  $('#tabs').addEventListener('contextmenu', (e) => {
    const t = e.target.closest('.tab:not(.group)'); if (!t) return;

  $$('.topbar .seg button').forEach((b) => b.addEventListener('click', () => setViewGroup(b.dataset.view)));
  $('#tidy-btn').addEventListener('click', toggleTidy);
  $('#sync-btn').addEventListener('click', syncDialog);
  $('#theme-btn').addEventListener('click', () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; renderAll({ preview: false }); });
  $('#desk-switch').addEventListener('click', deskSheet);
  $('#view-toggle-phone').addEventListener('click', () => setViewGroup(activeBoard().viewMode === 'freeform' ? 'list' : 'canvas'));

      { label: 'Grid view', icon: 'grid', action: () => setViewGroup('grid') },
      { label: S.syncing ? 'Syncing…' : 'Sync and backup', icon: 'cloud', action: syncDialog },

  $('#group-rename').addEventListener('click', async () => {
    const b = activeBoard(); if (!b.isGroup) return;
    const v = await promptText('Rename group', 'Group name', b.groupName, 'Rename');
    if (!v || v === b.groupName) return;
    pushUndo();
    for (const d of S.boards) for (const l of d.links) if (l.group === b.groupName) l.group = v;
    if (S.linkGroup === b.groupName) S.linkGroup = v;

    S.activeId = 'group:' + v; renderAll();
  });
  $('#group-ungroup').addEventListener('click', async () => {
    const b = activeBoard(); if (!b.isGroup) return;

    pushUndo();

    S.activeId = S.boards[0].id; renderAll(); toast('Group removed', true);
  });

  // Note action bar
  $('#note-bar').addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]'); const n = S.sel && findNote(S.sel); if (!b || !n) return;
    const act = b.dataset.act;
    if (act === 'preview') openPreview(n.id);
    else if (act === 'maximize') maximize(n.id);
    else if (act === 'open') openNative(n);
    else if (act === 'link') linkDialog(n.id);
    else if (act === 'delete') deleteNote(n.id);
    else if (act === 'send') window.PaperDeskSend?.open('note', n.id);
    else if (act === 'badges') showMenu(b, BADGES.map((x) => ({ label: x.label, icon: x.icon, checked: n.badges.includes(x.id), action: () => toggleBadge(n.id, x.id) })));
    else if (act === 'move') {
      const owner = ownerBoard(n.id);
      const dests = S.boards.filter((d) => d !== owner);
      showMenu(b, dests.length ? dests.map((d) => ({ label: d.title, hint: String(d.notes.length), action: () => {
        pushUndo(); owner.notes = owner.notes.filter((x) => x.id !== n.id); owner.links = owner.links.filter((l) => l.src !== n.id && l.dst !== n.id); d.notes.push(n);
        S.sel = null; renderAll(); toast(`Moved to ${d.title}`, true);
      } })) : [{ label: 'No other desks yet', disabled: true }, { sep: true }, { label: 'New desk…', icon: 'plus', action: newDesk }]);
    } else if (act === 'more') {
      showMenu(b, [
        ...(n.type === 'text' || n.type === 'drawing' ? [{ label: 'Edit text', icon: 'type', hint: 'Enter', action: () => startEdit(n.id) }] : []),
        { label: 'Zoom to note', icon: 'fit', action: () => fitTo([n], Math.max(1, viewOf(activeBoard()).zoom)) },
        { label: n.badges.includes('pin') ? 'Unpin' : 'Pin in place', icon: 'pin', action: () => toggleBadge(n.id, 'pin') },
        ...(n.scribbles?.length ? [{ label: 'Clear ink on note', icon: 'pen', action: () => { pushUndo(); n.scribbles = []; renderAll(); } }] : []),

  });

  // Rail & trays
  $('#rail').addEventListener('click', (e) => {
    const t = e.target.closest('[data-tool]'); if (t) { setTool((t.dataset.tool === 'draw' || t.dataset.tool === 'erase') && S.tool === t.dataset.tool ? 'select' : t.dataset.tool); }
  });
  $('#badge-btn').addEventListener('click', () => { if (S.tool !== 'select') setTool('select'); S.trayOpen = !S.trayOpen; renderRail(); });
  $('#close-tray').addEventListener('click', () => { S.trayOpen = false; renderRail(); });
  $('#clear-filter').addEventListener('click', () => { S.badgeFilter = null; renderAll({ preview: false }); });

  $('#phone-add').addEventListener('click', () => openPalette());
  $('#fab').addEventListener('click', () => openPalette());
  $('#draw-tray').addEventListener('click', (e) => {

      const d = pk.dataset, P = S.pen;

  $('#badge-chips').addEventListener('click', (e) => {
    const c = e.target.closest('[data-badge]'); if (!c) return;

  });
  $('#badge-chips').addEventListener('dragstart', (e) => {
    const c = e.target.closest('[data-badge]'); if (!c) return;

  // History & zoom
  $('#undo-btn').addEventListener('click', undo); $('#redo-btn').addEventListener('click', redo); $('#undo-phone').addEventListener('click', undo);
  $('#zoom-in').addEventListener('click', () => zoomStep(1.25)); $('#zoom-out').addEventListener('click', () => zoomStep(0.8));
  $('#zoom-pct').addEventListener('click', resetZoom);
  $('#zoom-fit').addEventListener('click', () => fitTo(visibleNotes())); $('#fit-phone').addEventListener('click', () => fitTo(visibleNotes()));
  $('#map-btn').addEventListener('click', () => { S.showMap = !S.showMap; renderCanvas(); save(); });
  const ov = $('#overview');
  const ovJump = (e) => {

  // Link banner
  $('#link-done').addEventListener('click', () => setTool('select'));
  $('#link-group').addEventListener('click', async () => { const v = await promptText('Link into group', 'Group name', S.linkGroup, 'Use group'); if (v) { S.linkGroup = v; renderCanvas(); save(); } });

  // Structured views
  $('#structured').addEventListener('click', (e) => {

    const o = e.target.closest('[data-open]'); if (o) openPreview(o.dataset.open);
  });
  $('#structured').addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.dataset.open) openPreview(e.target.dataset.open); });
  $('#structured').addEventListener('change', (e) => {
    if (e.target.id === 'type-filter') S.typeFilter = e.target.value || null;
    if (e.target.id === 'badge-filter') S.badgeFilter = e.target.value || null;
    renderAll({ preview: false });

  // Quick Look and expanded-note interactions (shared markup, two roots)
  for (const root of [$('#ql'), $('#maxview')]) {
    const noteOf = () => findNote(root.id === 'ql' ? S.previewId : S.maxId);
    root.addEventListener('click', (e) => {
      const n = noteOf(); if (!n) return;
      const un = e.target.closest('[data-unbadge]'); if (un) { toggleBadge(n.id, un.dataset.unbadge); return; }

        case 'close': closePreview(); break;
        case 'prev': stepPreview(-1); break;
        case 'next': stepPreview(1); break;
        case 'info': S.qlInfo = !S.qlInfo; renderViewers(); save(); break;
        case 'max': maximize(n.id); break;
        case 'restore': restoreMax(); break;
        case 'ql': openPreview(n.id); break;
        case 'open': openNative(n); break;

        case 'refresh': pushUndo(); n.rev = (n.rev || 1) + 1; n.refreshedAt = Date.now(); renderAll(); toast(`Snapshot refreshed (v${n.rev})`); break;
        case 'badge-menu': showMenu(b, BADGES.map((x) => ({ label: x.label, icon: x.icon, checked: n.badges.includes(x.id), action: () => toggleBadge(n.id, x.id) }))); break;

    root.addEventListener('input', (e) => {

    });

      if (e.target.hasAttribute('data-vnewtask') && e.key === 'Enter' && e.target.value.trim()) {
        const n = noteOf(); pushUndo(); n.tasks.push({ title: e.target.value.trim(), done: false }); renderAll(); $('[data-vnewtask]', root)?.focus();

  $('#ql-backdrop').addEventListener('click', () => closePreview());

  // Keyboard shortcuts

  document.addEventListener('keydown', (e) => {

      if (e.key === 'Escape') { e.preventDefault(); if (typing()) $('[data-v="restore"]', $('#maxview'))?.focus(); else restoreMax(); return; }
      if (typing()) return;
      if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
      if (mod || e.altKey) return;
      if (e.key === ' ') { e.preventDefault(); openPreview(S.maxId); }
      else if (k === 'f') { e.preventDefault(); restoreMax(); }
      return;
    }
    if (mod && k === 'k') { e.preventDefault(); searchBox.classList.add('open'); searchInput.focus(); searchInput.select(); return; }
    if (e.key === 'Escape') {
      if (typing()) return;
      S.tool = 'select'; S.trayOpen = false; S.pendingLink = null; S.sel = null; S.multi.clear(); renderCanvas(); renderRail();
      return;
    }
    if (typing()) return;
    if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && k === 'y') { e.preventDefault(); redo(); return; }
    if (mod && k === 'a' && activeBoard().viewMode === 'freeform') { e.preventDefault(); setSelection(visibleNotes().map((n) => n.id)); return; }
    if (mod && k === 'o') { e.preventDefault(); PAL.at = null; pickFiles(); return; }
    if (mod && (k === '=' || k === '+')) { e.preventDefault(); zoomStep(1.25); return; }
    if (mod && k === '-') { e.preventDefault(); zoomStep(0.8); return; }
    if (mod && k === '0') { e.preventDefault(); resetZoom(); return; }
    if (mod || e.altKey) return;
    if (e.shiftKey && e.code === 'Digit1') { fitTo(visibleNotes()); return; }

    if (e.key === ' ' && S.sel) { e.preventDefault(); openPreview(S.sel); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && S.multi.size > 1) { e.preventDefault(); deleteNotes(selectedIds()); return; }
    if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { e.preventDefault(); deleteNote(S.sel); }
  });
  // Paste onto the paper (uses the paste event, so no clipboard permission prompt)
  document.addEventListener('paste', (e) => {
    if ($('#palette').open && !PAL.form && !PAL.q.trim()) {
      if (e.clipboardData.files?.length) { e.preventDefault(); addFiles([...e.clipboardData.files], PAL.at); $('#palette').close(); return; }

    if (e.clipboardData.files?.length) { e.preventDefault(); addFiles([...e.clipboardData.files]); return; }
    const text = e.clipboardData.getData('text/plain'); if (!text.trim()) return;
    e.preventDefault(); placeTextDirect(text);
  });

  window.addEventListener('resize', () => { renderGroupBar(); renderMain(); renderViewers(); });

  /* ------------------------------------------------------------------
     PWA
     ------------------------------------------------------------------ */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
  }
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installPrompt = e; });

  window.PaperDeskApp = {
    $, $$, esc, icon, MOD, uid, clamp, isPhone,
    TYPES, COMMON_TYPES, URL_TYPES, FILE_TYPES, BADGES, B, PROVIDERS, INKS,
    S, VIEW, PAL, live, vpEl,
    save, pushUndo, undo, redo,
    groupNames, groupIndex, gVars, gColor, groupTabs,
    activeBoard, viewOf, homeBoard, findNote, ownerBoard, linksFor, visibleNotes,
    addNote, freeSpot, deleteNote, toggleBadge, createLink, viewCenter,
    shortAgo, timeAgo, host, emailOf, nameFromEmail, initials, fileName, pathOf,
    renderAll, renderTopbar, renderGroupBar, renderMain, renderCanvas, renderLinks, renderInk, inkSvg, inkLayer, showMenu,
    applyTransform, positionNoteBar, drawOverview, renderRail, renderStructured, renderViewers,
    toWorld, zoomAt, animateView, fitTo, reveal, zoomStep, resetZoom,
    select, setSelection, selectedIds, deleteNotes, commitEdit, startEdit, switchTo, setTool, setViewGroup,
    openPreview, closePreview, stepPreview, maximize, restoreMax, toggleTidy,
    toast, showMenu, openDialog, promptText, confirmDialog,
    linkDialog, editLinkDialog, newDesk, deskMenu, deskSheet,
    getInstallPrompt: () => installPrompt,
    setInstallPrompt: (v) => { installPrompt = v; },
    orig: { typeBody, noteHtml, viewerStage, viewerInfo, openNative, openPalette, syncDialog, addFiles, pickFiles, renderStructured },
    setHooks(ext) {
      if (ext.typeBody) typeBody = ext.typeBody;
      if (ext.noteHtml) noteHtml = ext.noteHtml;
      if (ext.viewerStage) viewerStage = ext.viewerStage;
      if (ext.viewerInfo) viewerInfo = ext.viewerInfo;
      if (ext.openNative) openNative = ext.openNative;
      if (ext.openPalette) openPalette = ext.openPalette;
      if (ext.syncDialog) syncDialog = ext.syncDialog;
      if (ext.addFiles) addFiles = ext.addFiles;
      if (ext.pickFiles) pickFiles = ext.pickFiles;
      if (ext.renderStructured) renderStructured = ext.renderStructured;
    }
  };

  renderAll();
