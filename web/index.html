<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1D1F22" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="PaperDesk — an infinite, borderless desk for dumping thoughts, files, voice memos, web snapshots and tasks." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PaperDesk" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="freeboard_features.css" />
  <link rel="stylesheet" href="send.css" />
  <title>PaperDesk</title>
  <style>
    /* ------------------------------------------------------------------
       Tokens — warm paper (light) / dark slate (dark)
       ------------------------------------------------------------------ */
    :root {
      --paper: #F6F4EF; --dot: #D6D0C4; --surface: #FFFFFF; --surface-2: #FAF9F6;
      --line: #E5E1D8; --line-2: #D4CFC4;
      --ink: #1C1B18; --ink-2: #4A463F; --ink-3: #6B665C;
      --accent: #2D55D9; --on-accent: #FFFFFF; --accent-soft: #E9EEFC;
      --danger: #B42318; --success: #0B7342; --star: #C88A00; --video: #23262B;
      --shadow-1: 0 1px 2px rgba(28,27,24,.06), 0 6px 20px rgba(28,27,24,.08);
      --shadow-2: 0 2px 4px rgba(28,27,24,.08), 0 16px 48px rgba(28,27,24,.16);
      --red: #B42318; --red-bg: #FDECEA; --amber: #8F4A06; --amber-bg: #FDF0DC;
      --blue: #2D55D9; --blue-bg: #E9EEFC; --violet: #6941C6; --violet-bg: #F0EBFB;
      --green: #0B7342; --green-bg: #E2F3E9; --teal: #0F6B63; --teal-bg: #DDF2EF;
      --gray: #4A463F; --gray-bg: #ECEAE4;
      --g0: #C2410C; --g1: #0F766E; --g2: #9D2C77; --g3: #0369A1; --g4: #5F6B12; --g5: #8A5A2B;
      --g0-soft: #FCEBDD; --g1-soft: #DDF2EF; --g2-soft: #F7E3EF; --g3-soft: #E0EFF8; --g4-soft: #EEF0D9; --g5-soft: #F3E8DC;
      --scrim: rgba(28,27,24,.32);
      --sans: 'Geist', 'Inter', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --mono: 'Geist Mono', 'Cascadia Mono', Consolas, 'SF Mono', Menlo, monospace;
      --rail-h: 84px;
      color-scheme: light;
    }
    [data-theme="dark"] {
      --paper: #141517; --dot: #2C2E33; --surface: #1D1F22; --surface-2: #191B1E;
      --line: #2C2F34; --line-2: #3A3E45;
      --ink: #EDEBE6; --ink-2: #BDB9B0; --ink-3: #959187;
      --accent: #86A0FF; --on-accent: #0D1430; --accent-soft: #222C4A;
      --danger: #FF9C8F; --success: #7BD8A4; --star: #F4C64E; --video: #0C0D0F;
      --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
      --shadow-2: 0 2px 4px rgba(0,0,0,.4), 0 16px 48px rgba(0,0,0,.5);
      --red: #FF9C8F; --red-bg: #3B1C19; --amber: #F5B860; --amber-bg: #36270F;
      --blue: #9DB2FF; --blue-bg: #1F2846; --violet: #C3ABFF; --violet-bg: #2C2342;
      --green: #7BD8A4; --green-bg: #16301F; --teal: #6ED6C8; --teal-bg: #132E2B;
      --gray: #C9C5BC; --gray-bg: #2A2C30;
      --g0: #F29A5B; --g1: #4CC9B8; --g2: #E58BC4; --g3: #6BB8E8; --g4: #C2CC6B; --g5: #D9A774;
      --g0-soft: #3A2618; --g1-soft: #14312E; --g2-soft: #3A1F31; --g3-soft: #162B3A; --g4-soft: #2B2E15; --g5-soft: #33261A;
      --scrim: rgba(0,0,0,.5);
      color-scheme: dark;
    }

    /* ------------------------------------------------------------------
       Base
       ------------------------------------------------------------------ */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: var(--sans); font-size: 13px; line-height: 1.5;
      background: var(--paper); color: var(--ink);
      overflow: hidden; -webkit-font-smoothing: antialiased;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .mono { font-family: var(--mono); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    svg.i.s14 { width: 14px; height: 14px; stroke-width: 2; }
    svg.i.s12 { width: 12px; height: 12px; stroke-width: 2.25; }
    svg.i.s16 { width: 16px; height: 16px; }
    svg.i.s20 { width: 20px; height: 20px; }
    svg.i.fill { fill: currentColor; stroke: none; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

    #app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }

    /* Icon button */
    .ib {
      width: 36px; height: 36px; display: inline-grid; place-items: center; flex: none;
      border: 0; border-radius: 8px; background: transparent; color: var(--ink-2);
    }
    .ib:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
    .ib[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    .ib:disabled { color: var(--line-2); cursor: default; background: transparent; }
    .ib.sm { width: 32px; height: 32px; }
    .ib.lg { width: 40px; height: 40px; border-radius: 10px; }
    .ib.danger { color: var(--danger); }

    .btn {
      height: 36px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px;
      border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
      font-weight: 500; white-space: nowrap;
    }
    .btn:hover { border-color: var(--line-2); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.06); }
    .btn.ghost { border-color: transparent; background: transparent; color: var(--accent); }
    .btn.ghost:hover { background: var(--accent-soft); }
    .btn.danger-ghost { border-color: transparent; background: transparent; color: var(--danger); }
    .btn.active { background: var(--accent-soft); border-color: var(--accent-soft); color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: default; }

    kbd { font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding: 2px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface); }
    .vdiv { width: 1px; height: 24px; background: var(--line); flex: none; margin: 0 4px; }
    .float { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-1); }

    /* ------------------------------------------------------------------
       Top bar
       ------------------------------------------------------------------ */
    .topbar {
      height: 56px; flex: none; display: flex; align-items: center; gap: 12px;
      padding: 0 12px 0 16px; padding-top: env(safe-area-inset-top);
      background: var(--surface); border-bottom: 1px solid var(--line); position: relative; z-index: 30;
    }
    .brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); flex: none; font-weight: 700; font-size: 15px; letter-spacing: -.01em; }
    .brand svg { width: 24px; height: 24px; }
    .tabs { display: flex; align-items: center; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; flex: none;
      border-radius: 8px; border: 1px solid transparent; background: transparent;
      color: var(--ink-2); font-weight: 500; white-space: nowrap;
    }
    .tab:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
    .tab[aria-current="page"] { background: var(--paper); border-color: var(--line); color: var(--ink); font-weight: 600; }
    .tab.group[aria-current="page"] { background: var(--gsoft); border-color: color-mix(in srgb, var(--gc) 35%, transparent); }
    .tab .count { font-family: var(--mono); font-size: 11px; color: var(--ink-3); font-weight: 500; }
    .gdot { width: 8px; height: 8px; border-radius: 3px; background: var(--gc); flex: none; display: inline-block; }
    .search {
      display: flex; align-items: center; gap: 8px; width: 248px; height: 36px; padding: 0 6px 0 10px; flex: none;
      border-radius: 8px; background: var(--paper); border: 1px solid var(--line); color: var(--ink-3);
    }
    .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: var(--ink); }
    .search input::placeholder { color: var(--ink-3); }
    .seg { display: flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--paper); border: 1px solid var(--line); flex: none; }
    .seg button { width: 34px; height: 28px; display: grid; place-items: center; border: 0; border-radius: 7px; background: transparent; color: var(--ink-3); }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
    .seg.text button { width: auto; padding: 0 10px; font-size: 12.5px; font-weight: 500; }
    .sync { display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border: 0; border-radius: 8px; background: transparent; color: var(--ink-3); flex: none; }
    .sync:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
    .sync svg { color: var(--success); }
    .desk-switch { display: none; }
    .phone-only { display: none !important; }

    .group-bar {
      display: none; align-items: center; gap: 10px; padding: 6px 16px; min-height: 44px;
      background: var(--surface); border-bottom: 1px solid var(--line); flex: none; z-index: 20;
    }
    .group-bar.show { display: flex; }
    .group-bar strong { font-weight: 600; }
    .group-bar .msg { flex: 1; min-width: 0; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ------------------------------------------------------------------
       Workspace & canvas
       ------------------------------------------------------------------ */
    #workspace { position: relative; flex: 1; min-height: 0; }
    #viewport {
      position: absolute; inset: 0; overflow: hidden; touch-action: none;
      background-color: var(--paper);
      background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
      background-size: calc(24px * var(--z, 1)) calc(24px * var(--z, 1));
      background-position: var(--bgx, 0) var(--bgy, 0);
      cursor: default; user-select: none; -webkit-user-select: none;
    }
    #viewport.tool-pan { cursor: grab; }
    #viewport.tool-pan.panning { cursor: grabbing; }
    #viewport.tool-text { cursor: text; }
    #viewport.tool-draw, #viewport.tool-scribble { cursor: crosshair; }
    #viewport.tool-link .note { cursor: copy; }
    #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
    #links, #ink { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }

    .note { position: absolute; border-radius: 10px; touch-action: none; }
    .note .card {
      position: absolute; inset: 0; padding: 12px; border-radius: 10px; overflow: hidden;
      background: var(--paper); border: 1px solid transparent;
      display: flex; flex-direction: column; gap: 6px;
      transition: background .12s, border-color .12s, box-shadow .12s, transform .12s;
    }
    .note:hover .card { background: var(--surface); border-color: var(--line-2); }
    #marquee { position: absolute; z-index: 30; pointer-events: none; border: 1.5px solid var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); border-radius: 4px; }
    #multi-bar { position: absolute; z-index: 40; left: 50%; top: 68px; transform: translateX(-50%); display: none; align-items: center; gap: 6px; padding: 6px 8px 6px 14px; border-radius: 999px; font-size: 13px; }
    #multi-bar.show { display: flex; }
    #world.multi-sel .handle { display: none !important; }
    #multi-bar .count { font-weight: 600; margin-right: 6px; }
    #multi-bar button { border: 1px solid var(--line-2); background: var(--paper); color: inherit; border-radius: 999px; padding: 4px 12px; font: inherit; cursor: pointer; }
    #multi-bar button[data-multi="delete"] { color: #B42318; }
    .note.selected .card { background: var(--paper); border: 1.5px solid var(--accent); }
    .note.dragging .card { background: var(--surface); box-shadow: var(--shadow-2); transform: rotate(-1.5deg); border-color: transparent; }
    .note.drop .card, .note.link-source .card { background: var(--accent-soft); border: 2px solid var(--accent); }
    .note.editing .card { background: var(--surface); border: 1.5px solid var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .note:focus-visible { outline: none; }
    .note:focus-visible .card { border: 1.5px solid var(--accent); }
    .meta { display: flex; align-items: center; gap: 6px; height: 18px; color: var(--ink-3); font-size: 11.5px; font-weight: 500; flex: none; }
    .meta .type { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .meta .ctx { font-family: var(--mono); font-size: 11px; }
    .meta .star { color: var(--star); }
    .meta .grip { opacity: 0; }
    .note:hover:not(.selected) .meta .grip { opacity: 1; }
    .meta .mini { width: 22px; height: 22px; border: 0; border-radius: 5px; background: transparent; color: var(--ink-3); display: grid; place-items: center; }
    .meta .mini.max { opacity: 0; transition: opacity .12s; }
    .note:hover .mini.max, .note.selected .mini.max, .note:focus-within .mini.max { opacity: 1; }
    @media (hover: none) { .meta .mini.max { display: none; } }
    .meta .mini:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
    .title { font-size: 15px; font-weight: 600; line-height: 1.3; letter-spacing: -.005em; color: var(--ink); flex: none;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
    .title.empty { color: var(--ink-3); }
    .content { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 6px; }
    .body { font-size: 13px; line-height: 1.5; color: var(--ink-2); white-space: pre-line; overflow: hidden; overflow-wrap: anywhere; }
    .body.italic { font-style: italic; }
    .monoline { font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
    .sub { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: none; }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; height: 22px; overflow: hidden; flex: none; }
    .chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 11.5px; font-weight: 600; white-space: nowrap; background: var(--tbg); color: var(--tfg); border: 0; }
    .chip.lg { height: 28px; padding: 0 10px 0 8px; font-size: 12.5px; border-radius: 7px; }
    .chip.on { background: var(--tfg); color: var(--tbg); }
    .chip .x { display: grid; place-items: center; width: 18px; height: 18px; border: 0; border-radius: 4px; background: transparent; color: inherit; margin-right: -4px; }
    .t-red { --tfg: var(--red); --tbg: var(--red-bg); } .t-amber { --tfg: var(--amber); --tbg: var(--amber-bg); }
    .t-blue { --tfg: var(--blue); --tbg: var(--blue-bg); } .t-violet { --tfg: var(--violet); --tbg: var(--violet-bg); }
    .t-green { --tfg: var(--green); --tbg: var(--green-bg); } .t-teal { --tfg: var(--teal); --tbg: var(--teal-bg); }
    .t-gray { --tfg: var(--gray); --tbg: var(--gray-bg); }
    .task { display: flex; align-items: center; gap: 8px; min-height: 26px; font-size: 13px; color: var(--ink); cursor: pointer; }
    .task input { margin: 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; cursor: pointer; }
    .task span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task.done span { color: var(--ink-3); text-decoration: line-through; }
    .thumb { flex: 1; min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; position: relative; }
    .thumb.web { padding: 10px; display: flex; flex-direction: column; gap: 7px; }
    .thumb.web .dots { display: flex; gap: 5px; } .thumb.web .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); }
    .thumb.web .bar { height: 6px; border-radius: 3px; background: var(--line); } .thumb.web .bar.h { height: 8px; width: 62%; background: var(--line-2); }
    .thumb.web .cells { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; min-height: 0; }
    .thumb.web .cells i { border-radius: 4px; background: var(--paper); } .thumb.web .cells i:nth-child(2) { background: var(--accent-soft); }
    .thumb.pages { background: var(--surface-2); display: flex; align-items: flex-end; justify-content: center; gap: 10px; padding-top: 12px; }
    .thumb.pages i { width: 64px; height: calc(100% - 4px); background: var(--surface); box-shadow: 0 1px 3px rgba(0,0,0,.12); border-radius: 2px;
      background-image: linear-gradient(var(--line-2), var(--line-2)), repeating-linear-gradient(transparent 0 7px, var(--line-2) 7px 10px);
      background-size: 70% 5px, 80% 100%; background-position: 8px 10px, 8px 20px; background-repeat: no-repeat; }
    .thumb.pages i + i { height: calc(90% - 4px); background-image: repeating-linear-gradient(transparent 0 7px, var(--line-2) 7px 10px); background-size: 80% 100%; background-position: 8px 10px; }
    .thumb.video { background: var(--video); border: 0; display: grid; place-items: center; }
    .playbig { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); color: #1C1B18; display: grid; place-items: center; }
    .duration { position: absolute; right: 8px; bottom: 8px; font-family: var(--mono); font-size: 11px; color: #fff; background: rgba(0,0,0,.6); padding: 1px 6px; border-radius: 4px; }
    .thumb.clip { background: var(--surface-2); display: grid; place-items: center; color: var(--ink-3); text-align: center; }
    .player { display: flex; align-items: center; gap: 10px; height: 32px; flex: none; }
    .play { width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
    .wave { flex: 1; display: flex; align-items: center; gap: 2px; height: 28px; overflow: hidden; }
    .wave i { width: 3px; flex: none; border-radius: 2px; background: var(--line-2); }
    .wave i.on { background: var(--accent); }
    .person { display: flex; align-items: center; gap: 8px; min-width: 0; flex: none; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; flex: none; background: var(--violet-bg); color: var(--violet); }
    .person .who { min-width: 0; display: flex; flex-direction: column; }
    .person .who b { font-weight: 500; font-size: 12.5px; color: var(--ink); }
    .bigtime { font-family: var(--mono); font-size: 26px; font-weight: 500; letter-spacing: -.02em; color: var(--ink); }
    .row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .datebox { width: 44px; flex: none; text-align: center; padding: 4px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); }
    .datebox small { display: block; font-size: 10px; font-weight: 600; color: var(--danger); }
    .datebox b { display: block; font-size: 18px; font-weight: 600; line-height: 1.2; }
    .stamp { flex: 1; display: grid; place-items: center; color: var(--star); }
    .ring { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    .scribbles { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
    .handle { position: absolute; width: 20px; height: 20px; display: none; place-items: center; z-index: 2; touch-action: none; }
    .handle::after { content: ""; width: 9px; height: 9px; border-radius: 2px; background: var(--surface); border: 1.5px solid var(--accent); }
    .note.selected:not(.editing):not(.dragging) .handle { display: grid; }
    .handle.tl { left: -10px; top: -10px; cursor: nwse-resize; } .handle.br { right: -10px; bottom: -10px; cursor: nwse-resize; }
    .handle.tr { right: -10px; top: -10px; cursor: nesw-resize; } .handle.bl { left: -10px; bottom: -10px; cursor: nesw-resize; }
    .note .edit-title { border: 0; outline: none; background: transparent; padding: 0; font-size: 15px; font-weight: 600; line-height: 1.3; color: var(--ink); width: 100%; }
    .note .edit-body { flex: 1; border: 0; outline: none; background: transparent; padding: 0; resize: none; font-size: 13px; line-height: 1.5; color: var(--ink-2); width: 100%; }
    .link-pill { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px;
      border-radius: 11px; background: var(--surface); border: 1px solid var(--line); font-size: 11px; font-weight: 500; color: var(--ink-2); white-space: nowrap; z-index: 3; }
    .link-pill:hover { border-color: var(--line-2); }

    /* Overlays on the canvas */

    #note-bar { display: none; align-items: center; gap: 2px; padding: 4px; }
    #note-bar.show { display: flex; }
    #link-banner { left: 50%; top: 12px; transform: translateX(-50%); display: none; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 12px; white-space: nowrap; }
    #link-banner.show { display: flex; }
    #history { left: 16px; bottom: 20px; display: flex; align-items: center; gap: 12px; }
    #history .float { display: flex; gap: 2px; padding: 4px; }
    #history .hint { font-size: 12px; color: var(--ink-3); }
    #zoombox { right: 16px; bottom: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    #zoombox .float.ctrl { display: flex; align-items: center; gap: 2px; padding: 4px; }
    #zoom-pct { height: 32px; min-width: 52px; border: 0; border-radius: 7px; background: transparent; font-family: var(--mono); font-size: 12px; }
    #zoom-pct:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
    #overview { width: 176px; height: 104px; display: block; cursor: pointer; border-radius: 10px; }

    #empty h2 { margin: 10px 0 4px; font-size: 16px; font-weight: 600; color: var(--ink); }
    #empty p { margin: 0; }

    /* Tool rail */
    #rail-wrap { position: absolute; left: 0; right: 0; bottom: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none; z-index: 26; }
    #rail-wrap > * { pointer-events: auto; }
    #rail { display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 14px; }
    #rail .add { height: 40px; padding: 0 16px 0 12px; border-radius: 10px; }
    .tray { padding: 10px 12px 12px; border-radius: 12px; max-width: min(760px, calc(100vw - 32px)); display: none; }
    .tray.show { display: block; }
    .tray .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--ink-3); font-size: 12px; }
    .tray .head span { flex: 1; }
    .tray .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .tray .chip { cursor: grab; }
    #draw-tray.show, #erase-tray.show { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; gap: 6px 8px; padding: 6px 8px; }
    .seg.ink-kinds button, .seg.shape-pick button, .seg.sizes button { width: 34px; }
    .seg .sz { border-radius: 50%; background: currentColor; display: block; }
    #shape-pick { display: none; } #draw-tray.shape #shape-pick { display: flex; }
    .seg.shape-pick svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
    .seg.shape-pick [data-fill][aria-pressed="true"] svg { fill: color-mix(in srgb, currentColor 30%, transparent); }
    #erase-tray .msg { font-size: 12px; color: var(--ink-3); padding: 0 4px; }
    #ink path.hl, .scribbles path.hl, .drawbox path.hl { mix-blend-mode: multiply; }
    [data-theme="dark"] #ink path.hl, [data-theme="dark"] .scribbles path.hl { mix-blend-mode: screen; }
    #viewport.tool-erase, #viewport.tool-erase .note, #viewport.tool-erase .note * { cursor: none !important; }
    #erase-ring { position: absolute; border-radius: 50%; border: 1.5px solid var(--ink-2); background: color-mix(in srgb, var(--paper) 55%, transparent); pointer-events: none; z-index: 30; transform: translate(-50%, -50%); display: none; }
    #viewport.tool-erase #erase-ring { display: block; }
    .note.erase-hit { opacity: .35; outline: 2px dashed var(--danger, #B42318); outline-offset: 2px; }
    .swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; background: transparent; display: grid; place-items: center; }
    .swatch i { width: 16px; height: 16px; border-radius: 50%; background: var(--c); }
    .swatch[aria-pressed="true"] { border-color: var(--accent); }
    #fab { position: absolute; right: 24px; bottom: 24px; display: none; z-index: 26; box-shadow: var(--shadow-1); height: 44px; }
    #fab.show { display: inline-flex; }

    /* ------------------------------------------------------------------
       Structured views
       ------------------------------------------------------------------ */
    #structured { position: absolute; inset: 0; overflow-y: auto; display: none; background: var(--paper); }
    #structured.show { display: block; }
    .sv { max-width: 1240px; margin: 0 auto; padding: 24px 24px 120px; }
    .sv-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 16px; }
    .sv-head h1 { margin: 0 12px 0 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; }
    .sv-head select { height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); padding: 0 8px; }
    .sv-head .count { color: var(--ink-3); }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(240px, 100%), 1fr)); gap: 16px; }
    .cards.gallery { grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
    .cards.mosaic { display: block; columns: 260px; column-gap: 16px; }
    .cards.mosaic .card2 { break-inside: avoid; margin-bottom: 16px; height: auto; min-height: 0; }
    .card2 { height: 200px; display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); text-align: left; overflow: hidden; }
    .cards.gallery .card2 { height: 260px; }
    .card2:hover { border-color: var(--line-2); box-shadow: var(--shadow-1); }
    .card2 .body { flex: 1; }
    .list { border-radius: 12px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; }
    .lrow { display: flex; align-items: center; gap: 12px; padding: 10px 12px; min-height: 60px; border-top: 1px solid var(--line); cursor: pointer; }
    .lrow:first-child { border-top: 0; }
    .lrow:hover { background: var(--surface-2); }
    .tt { width: 36px; height: 36px; border-radius: 8px; background: var(--paper); display: grid; place-items: center; color: var(--ink-2); flex: none; }
    .lrow .main { flex: 1; min-width: 0; }
    .lrow .main b { display: block; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lrow .main small { display: block; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
    table.details { width: 100%; min-width: 860px; border-collapse: collapse; }
    table.details th { text-align: left; font-size: 12px; font-weight: 500; color: var(--ink-3); padding: 12px 16px; border-bottom: 1px solid var(--line); }
    table.details td { padding: 10px 16px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    table.details tr:last-child td { border-bottom: 0; }
    table.details tbody tr { cursor: pointer; }
    table.details tbody tr:hover { background: var(--surface-2); }
    .cell-note { display: flex; align-items: center; gap: 12px; }
    .cell-note b { display: block; font-size: 14px; font-weight: 600; }
    .cell-note small { display: block; font-size: 12.5px; color: var(--ink-3); }
    .cell-badges { display: flex; flex-wrap: wrap; gap: 4px; }
    .gname { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }

    /* ------------------------------------------------------------------
       Quick Look — centered pop-up that zooms out of the note
       ------------------------------------------------------------------ */
    #ql-layer { position: fixed; inset: 0; z-index: 55; display: grid; place-items: center; }
    #ql-layer[hidden] { display: none; }
    #ql-backdrop { position: absolute; inset: 0; background: rgba(28,27,24,.30); -webkit-backdrop-filter: blur(6px) saturate(1.1); backdrop-filter: blur(6px) saturate(1.1); }
    [data-theme="dark"] #ql-backdrop { background: rgba(0,0,0,.5); }
    #ql { position: relative; width: min(980px, calc(100vw - 48px)); height: min(720px, calc(100vh - 80px)); display: flex; flex-direction: column; overflow: hidden; outline: none;
      background: var(--surface); border: 1px solid rgba(0,0,0,.08); border-radius: 14px; box-shadow: 0 24px 64px rgba(0,0,0,.24), 0 2px 6px rgba(0,0,0,.08);
      transition: width .2s cubic-bezier(.2,.8,.2,1); transform-origin: center; will-change: transform; }
    #ql.info { width: min(1180px, calc(100vw - 48px)); }
    [data-theme="dark"] #ql { border-color: var(--line-2); }
    .ql-bar { height: 52px; flex: none; display: flex; align-items: center; gap: 2px; padding: 0 10px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
    .ql-bar .ttl { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; margin: 0 6px 0 8px; color: var(--ink-3); }
    .ql-bar .btn { height: 34px; margin-right: 4px; } .ql-bar .btn span { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ql-bar .ib[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
    .title-in { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 6px 6px; border-radius: 6px; font: inherit; font-size: 15px; font-weight: 600; color: var(--ink); }
    .title-in:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
    .title-in:focus { background: var(--surface); box-shadow: 0 0 0 2px var(--accent-soft); }
    .title-in.big { font-size: 20px; letter-spacing: -.01em; }
    .ql-foot { height: 34px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; color: var(--ink-3); background: var(--surface-2); border-top: 1px solid var(--line); }
    .ql-foot kbd, .hint kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2); background: var(--surface); }
    .v-main { flex: 1; min-height: 0; display: flex; }
    .v-stage { flex: 1; min-width: 0; overflow-y: auto; background: var(--surface); }
    .v-info { width: 340px; flex: none; overflow-y: auto; background: var(--surface-2); border-left: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 22px; }
    .v-info > * { flex-shrink: 0; }
    .v-info.inline { width: auto; border-left: 0; border-top: 1px solid var(--line); padding: 20px; }

    /* Shared stage content */
    .vs { max-width: 860px; margin: 0 auto; padding: 28px 32px 40px; display: flex; flex-direction: column; gap: 18px; box-sizing: border-box; }
    .vs.lg { max-width: 940px; padding: 40px 48px 64px; gap: 22px; }
    .vs.fill { min-height: 100%; } .vs.fill .doc { flex: 1; }
    .vs .doc { width: 100%; min-height: 220px; border: 0; outline: none; resize: none; background: transparent; padding: 0; font: inherit; font-size: 17px; line-height: 1.65; color: var(--ink); }
    .vs.lg .doc { font-size: 18px; }
    .vs .doc::placeholder { color: var(--ink-3); }
    .vs section textarea.field { min-height: 110px; }
    .vs .cap { text-align: center; font-size: 12.5px; color: var(--ink-3); margin-top: -6px; }
    .spread { display: flex; gap: 20px; justify-content: center; padding: 28px; border-radius: 12px; background: #ECEAE4; }
    [data-theme="dark"] .spread { background: var(--surface-2); }
    .spread .page { flex: 1; max-width: 330px; aspect-ratio: 8.5 / 11; background-color: #fff; border-radius: 2px; box-shadow: 0 2px 10px rgba(0,0,0,.14);
      background-image: repeating-linear-gradient(transparent 0 12px, #E5E1D8 12px 16px); background-size: 82% 72%; background-position: 50% 26%; background-repeat: no-repeat; }
    .spread .page.head { background-image: linear-gradient(#4A463F, #4A463F), repeating-linear-gradient(transparent 0 12px, #E5E1D8 12px 16px); background-size: 58% 12px, 82% 64%; background-position: 18% 8%, 50% 34%; }
    [data-theme="dark"] .spread .page { background-color: #2A2C30; }
    .vid { position: relative; aspect-ratio: 16 / 9; border-radius: 12px; background: var(--video); display: grid; place-items: center; overflow: hidden; }
    .vid .big { width: 72px; height: 72px; border-radius: 50%; border: 0; background: rgba(255,255,255,.94); color: #1C1B18; display: grid; place-items: center; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    .vid .big .i { width: 28px; height: 28px; }
    .vid .dur { position: absolute; right: 12px; bottom: 16px; font-size: 12px; color: #fff; background: rgba(0,0,0,.55); padding: 2px 7px; border-radius: 5px; }
    .vid .scrub { position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: rgba(255,255,255,.2); } .vid .scrub i { display: block; height: 100%; background: var(--accent); }
    .aud { display: flex; align-items: center; gap: 20px; padding: 24px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
    .aud .play { width: 56px; height: 56px; flex: none; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
    .aud .play .i { width: 22px; height: 22px; }
    .aud .wave { flex: 1; height: 72px; display: flex; align-items: center; gap: 3px; } .aud .wave i { flex: 1; min-width: 2px; border-radius: 2px; background: var(--line-2); } .aud .wave i.on { background: var(--accent); }
    .aud .dur { font-size: 12.5px; color: var(--ink-3); }
    .browser { border-radius: 12px; border: 1px solid var(--line); overflow: hidden; background: var(--surface); }
    .browser .chrome { height: 40px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
    .browser .chrome i { width: 10px; height: 10px; border-radius: 50%; background: var(--line-2); flex: none; }
    .browser .url { flex: 1; min-width: 0; margin-left: 8px; height: 26px; display: flex; align-items: center; padding: 0 10px; border-radius: 6px; background: var(--surface); font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .browser .page { aspect-ratio: 16 / 9; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .browser .bar { display: block; height: 8px; border-radius: 4px; background: var(--line); } .browser .bar.h { height: 14px; width: 45%; background: var(--line-2); }
    .browser .cells { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 6px; } .browser .cells i { border-radius: 8px; background: var(--paper); } .browser .cells i:nth-child(2) { background: var(--accent-soft); }
    .clipimg { aspect-ratio: 16 / 10; border-radius: 12px; border: 1px solid var(--line); display: grid; place-content: center; justify-items: center; gap: 8px; color: var(--ink-3);
      background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 24px 24px; }
    .clipimg .i { width: 40px; height: 40px; }
    .drawbox { aspect-ratio: 4 / 3; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); display: grid; place-items: center; text-align: center; padding: 16px; }
    .drawbox svg { width: 100%; height: 100%; }
    .hero { display: flex; align-items: center; gap: 18px; padding: 20px 22px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); }
    .hero .grow { min-width: 0; } .hero b { display: block; font-size: 17px; font-weight: 600; } .hero .grow > span { display: block; margin-top: 2px; font-size: 13px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hero-ic { width: 56px; height: 56px; flex: none; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; } .hero-ic .i { width: 26px; height: 26px; }
    .hero .bigtime { font-family: var(--mono); font-size: 40px; font-weight: 600; letter-spacing: -.02em; color: var(--ink); }
    .datebox.lg { width: 64px; height: 68px; } .datebox.lg b { font-size: 28px; }
    .avatar.lg { width: 56px; height: 56px; font-size: 20px; flex: none; }
    .progress .track { height: 6px; border-radius: 3px; background: var(--line); margin-top: 8px; overflow: hidden; } .progress .track i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .2s; }
    .tasks { display: flex; flex-direction: column; }
    .vtask { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 6px; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .vtask:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
    .vtask input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
    .vtask.done span { color: var(--ink-3); text-decoration: line-through; }
    .newtask { display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); color: var(--ink-3); }
    .newtask:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .newtask input { flex: 1; border: 0; outline: none; background: transparent; font: inherit; font-size: 14px; color: var(--ink); }

    /* Expanded note — fills the workspace and grows out of the note */
    #maxview { position: absolute; inset: 0; z-index: 50; background: var(--surface); outline: none; will-change: clip-path; }
    #maxview[hidden] { display: none; }
    .mv-inner { height: 100%; display: flex; flex-direction: column; }
    .mv-head { height: 60px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid var(--line); }
    .mv-head .back { height: 40px; color: var(--ink); } .mv-head .mv-type { color: var(--ink-3); display: grid; margin-left: 4px; }
    .mv-head .chips-row { display: flex; gap: 6px; flex-wrap: nowrap; }
    #maxview .v-info { width: 360px; }
    body.has-max #note-bar { display: none !important; }
    .stage { border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); overflow: hidden; position: relative; display: grid; place-items: center; }
    .stage.pdf { height: 260px; background: #ECEAE4; } [data-theme="dark"] .stage.pdf { background: var(--surface-2); }
    .stage.pdf .pg { width: 140px; height: 190px; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12); border-radius: 3px; display: inline-block; margin: 0 7px;
      background-image: linear-gradient(#4A463F, #4A463F), repeating-linear-gradient(transparent 0 9px, #E5E1D8 9px 13px);
      background-size: 60% 9px, 80% 60%; background-position: 16px 18px, 16px 40px; background-repeat: no-repeat; }
    [data-theme="dark"] .stage.pdf .pg { background-color: #2A2C30; }
    .stage .pages-pill { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); font-family: var(--mono); font-size: 11px; color: #fff; background: rgba(28,27,24,.72); padding: 3px 8px; border-radius: 6px; }
    .stage.video { height: 240px; background: var(--video); border: 0; }
    .stage.audio { height: 140px; }
    .stage.web { height: 220px; background: var(--surface); padding: 16px; display: flex; flex-direction: column; gap: 8px; place-items: stretch; }
    .stage.web .bar { height: 6px; border-radius: 3px; background: var(--line); } .stage.web .bar.h { height: 10px; width: 180px; background: var(--line-2); }
    .stage.web .cells { flex: 1; display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; } .stage.web .cells i { border-radius: 6px; background: var(--paper); } .stage.web .cells i:nth-child(2) { background: var(--accent-soft); }
    .stage.plain { height: 120px; color: var(--ink-3); }
    .pv-actions { display: flex; gap: 8px; } .pv-actions .primary { flex: 1; justify-content: center; height: 40px; min-width: 0; } .pv-actions .primary span { overflow: hidden; text-overflow: ellipsis; }
    .sec-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; font-size: 13px; font-weight: 600; }
    .field { width: 100%; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); padding: 10px 12px; outline: none; color: var(--ink); }
    .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    textarea.field { resize: vertical; min-height: 84px; line-height: 1.5; font-size: 14px; }
    .field.mono { font-family: var(--mono); font-size: 12.5px; }
    .links { border-radius: 10px; border: 1px solid var(--line); overflow: hidden; }
    .linkrow { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 6px 12px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
    .linkrow:first-child { border-top: 0; }
    .linkrow:hover { background: var(--surface-2); }
    .linkrow .grow { flex: 1; min-width: 0; } .linkrow b { display: block; font-weight: 500; font-size: 13.5px; } .linkrow small { color: var(--ink-3); font-size: 12px; }
    dl.details { display: grid; grid-template-columns: 104px 1fr; gap: 8px 12px; margin: 12px 0 0; }
    dl.details dt { color: var(--ink-3); } dl.details dd { margin: 0; overflow-wrap: anywhere; }
    .muted { color: var(--ink-3); }

    /* ------------------------------------------------------------------
       Dialogs, palette, menus, toast
       ------------------------------------------------------------------ */
    dialog { border: 0; padding: 0; color: var(--ink); background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-2); max-width: calc(100vw - 32px); }
    dialog::backdrop { background: var(--scrim); }
    .dlg { width: 440px; max-width: 100%; padding: 22px 24px 18px; display: flex; flex-direction: column; gap: 14px; }
    .dlg h2 { margin: 0; font-size: 18px; font-weight: 600; }
    .dlg p { margin: 0; color: var(--ink-2); }
    .dlg label { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
    .dlg label.provider, .dlg label.switch { flex-direction: row; font-size: inherit; font-weight: 400; color: var(--ink); }
    .dlg .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .dlg .actions .left { margin-right: auto; }
    .chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .pick { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; }
    .pick:hover { border-color: var(--line-2); }
    #palette { width: 640px; margin-top: 96px; overflow: hidden; }
    .pal-input { display: flex; align-items: center; gap: 12px; height: 60px; padding: 0 16px 0 18px; border-bottom: 1px solid var(--line); color: var(--ink-3); }
    .pal-input input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 16px; color: var(--ink); }
    .pal-body { max-height: calc(100vh - 280px); overflow-y: auto; padding: 8px; }
    .pal-label { padding: 8px 10px 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
    .pal-row { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; }
    .pal-row .ic { width: 28px; height: 28px; border-radius: 7px; background: var(--paper); display: grid; place-items: center; color: var(--ink-2); flex: none; }
    .pal-row .grow { flex: 1; min-width: 0; } .pal-row b { display: block; font-size: 14px; font-weight: 500; } .pal-row small { display: block; font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pal-row.hi { background: var(--accent-soft); } .pal-row.hi .ic { background: var(--surface); color: var(--accent); }
    .type-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; padding: 4px 8px 4px; }
    .type-tile { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 12px; border-radius: 10px; border: 1px solid var(--line); background: transparent; font-weight: 500; text-align: left; }
    .type-tile:hover, .type-tile.hi { border-color: var(--accent); background: var(--accent-soft); }
    .type-tile svg { color: var(--ink-2); }
    .pal-foot { display: flex; justify-content: space-between; height: 40px; align-items: center; padding: 0 18px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: 12px; color: var(--ink-3); }
    .capture-tiles { display: none; }
    .menu { position: fixed; z-index: 60; min-width: 200px; padding: 6px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2); display: none; }
    .menu.show { display: block; }
    .menu button { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; text-align: left; }
    .menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
    .menu button[aria-checked="true"]::after { content: ""; margin-left: auto; width: 12px; height: 7px; border-left: 2px solid var(--accent); border-bottom: 2px solid var(--accent); transform: rotate(-45deg) translateY(-2px); }
    .menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
    .menu .lbl { padding: 6px 10px 2px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
    #toast { position: fixed; left: 50%; bottom: 112px; transform: translateX(-50%) translateY(12px); opacity: 0; pointer-events: none; z-index: 70;
      display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 8px 8px 8px 16px; border-radius: 10px; background: var(--ink); color: var(--surface);
      box-shadow: var(--shadow-2); transition: opacity .15s, transform .15s; max-width: calc(100vw - 32px); }
    [data-theme="dark"] #toast { background: var(--line-2); color: var(--ink); }
    #toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
    #toast button { border: 0; background: transparent; color: #AFC0FF; font-weight: 600; padding: 6px 8px; border-radius: 6px; }
    [data-theme="dark"] #toast button { color: var(--accent); }
    .provider { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
    .provider:first-child { border-top: 0; }
    .provider input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
    .provider .grow { flex: 1; min-width: 0; } .provider b { display: block; font-weight: 500; font-size: 14px; } .provider small { display: block; font-family: var(--mono); font-size: 11px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .switch input { width: 40px; height: 22px; accent-color: var(--accent); }

    /* ------------------------------------------------------------------
       Medium widths
       ------------------------------------------------------------------ */
    @media (max-width: 1180px) { #history .hint, .tidy-label { display: none; } }
    @media (max-width: 980px) { .search { width: 36px; padding: 0; justify-content: center; border-color: transparent; background: transparent; } .search input, .search kbd { display: none; } .search.open { position: absolute; left: 12px; right: 12px; width: auto; padding: 0 6px 0 10px; background: var(--surface); border-color: var(--accent); z-index: 5; } .search.open input { display: block; } }

    /* ------------------------------------------------------------------
       Phone
       ------------------------------------------------------------------ */
    @media (max-width: 719px) {
      :root { --rail-h: 96px; }
      .topbar { gap: 4px; padding: 0 4px 0 6px; }
      .topbar .brand, .tabs, .topbar .seg, #tidy-btn, .topbar .vdiv, .sync, #theme-btn { display: none !important; }
      .desk-switch { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; height: 44px; padding: 0 8px; border: 0; border-radius: 10px; background: transparent; font-size: 16px; font-weight: 600; text-align: left; }
      .desk-switch span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .phone-only { display: inline-grid !important; }
      .ib.ph { width: 44px; height: 44px; }
      .search { width: 44px; height: 44px; }
      .group-bar { padding: 6px 8px 6px 12px; } .group-bar strong { display: none; }
      #history, #zoombox, #link-banner .grp-label { display: none !important; }
      #phone-ctrl { display: flex !important; }
      #rail-wrap { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); align-items: stretch; }
      #rail-row { display: flex; align-items: center; gap: 10px; }
      #rail { flex: 1; justify-content: space-between; border-radius: 16px; padding: 4px; }
      #rail .ib.lg { width: 48px; height: 48px; border-radius: 12px; }
      #rail [data-tool="pan"], #rail [data-tool="text"], #rail .vdiv, #rail .add { display: none; }
      #phone-add { display: grid !important; }
      #fab { right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); height: 52px; }
      #ql { width: calc(100vw - 16px); height: calc(100dvh - 40px); border-radius: 16px; }
      .ql-bar { padding: 0 6px; height: 56px; } .ql-bar .ib { width: 44px; height: 44px; }
      .vs, .vs.lg { padding: 20px 18px 28px; gap: 16px; }
      .vs .doc { font-size: 16px; }
      .spread { padding: 16px; gap: 10px; }
      .mv-head { padding: 0 6px; gap: 2px; } .mv-head .ib { width: 44px; height: 44px; } .mv-head .vdiv, .mv-head .mv-type { display: none; }
      .title-in.big { font-size: 17px; }
      .hero { padding: 16px; gap: 14px; } .hero .bigtime { font-size: 30px; }
      #palette { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 20px 20px 0 0; max-height: 92vh; }
      .pal-body { max-height: calc(92vh - 70px); }
      .capture-tiles { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 8px; }
      .capture-tiles button { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 4px 12px; border: 0; border-radius: 14px; background: var(--paper); font-size: 12.5px; font-weight: 600; }
      .capture-tiles button:first-child { background: var(--accent-soft); color: var(--accent); }
      .capture-rows, .pal-foot { display: none !important; }
      .type-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
      .sv { padding: 16px 16px 120px; }
      .dlg { padding: 20px; }
      #toast { bottom: calc(110px + env(safe-area-inset-bottom)); }
      .cards { grid-template-columns: 1fr; }
    }
    #phone-ctrl { display: none; position: absolute; right: 12px; bottom: calc(var(--rail-h) + 24px + env(safe-area-inset-bottom)); flex-direction: column; gap: 2px; padding: 4px; z-index: 25; }
    #phone-ctrl .ib { width: 44px; height: 44px; }
    #phone-add { display: none; width: 58px; height: 58px; border-radius: 18px; border: 0; background: var(--accent); color: var(--on-accent); place-items: center; flex: none;
      box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 30%, transparent); }

  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

  const S = {
    boards: stored?.boards?.length ? stored.boards : seed(),
    activeId: stored?.activeId || 'board_main_desk',
    groupViews: {},
    tool: 'select', drawMode: 'draw', ink: stored?.ink || '#B42318',
    pen: Object.assign({ kind: 'pen', shape: 'rect', size: 'm', hl: '#FFD84D', fill: false, erase: 'ink', eraseSize: 'm' }, stored?.pen || {}),
    sel: null, multi: new Set(), previewId: null, maxId: null, qlInfo: stored?.qlInfo ?? window.innerWidth >= 1100, editingId: null,
    pendingLink: null, linkGroup: stored?.linkGroup || 'Product Launch',
    search: '', badgeFilter: null, typeFilter: null,
    trayOpen: false, showMap: stored?.showMap ?? true,
    theme: stored?.theme || (prefersDark ? 'dark' : 'light'),
    cloud: stored?.cloud || 'googleDrive', autoSync: stored?.autoSync ?? true,
    lastSync: Date.now(), syncing: false,
    undo: [], redo: [], undoKey: null, undoAt: 0,
  };
  if (!S.boards.some((b) => b.id === S.activeId) && !String(S.activeId).startsWith('group:')) S.activeId = S.boards[0].id;

  let saveTimer = 0;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify({
          boards: S.boards, activeId: S.activeId, theme: S.theme, cloud: S.cloud,
          autoSync: S.autoSync, showMap: S.showMap, linkGroup: S.linkGroup, ink: S.ink, pen: S.pen, qlInfo: S.qlInfo,
        }));
      } catch { /* storage may be unavailable (private mode) */ }
      window.PaperDeskApp?.onSaved?.();
    }, 250);
  }

  function pushUndo(key) {
    const now = Date.now();
    if (key && key === S.undoKey && now - S.undoAt < 2000) { S.undoAt = now; return; }
    S.undoKey = key || null; S.undoAt = now;
    S.undo.push(JSON.stringify(S.boards));
    if (S.undo.length > 60) S.undo.shift();
    S.redo = [];
    if (S.autoSync) S.lastSync = now;
  }
  function restore(raw) {
    const views = Object.fromEntries(S.boards.map((b) => [b.id, b]));
    S.boards = JSON.parse(raw);
    for (const b of S.boards) { const v = views[b.id]; if (v) { b.zoom = v.zoom; b.panX = v.panX; b.panY = v.panY; } }
    if (!S.boards.some((b) => b.id === S.activeId) && !groupTabs().some((g) => g.id === S.activeId)) S.activeId = S.boards[0].id;
    if (S.sel && !findNote(S.sel)) S.sel = null;
    for (const id of [...S.multi]) if (!findNote(id)) S.multi.delete(id);
    if (S.multi.size < 2) S.multi.clear();
    if (S.previewId && !findNote(S.previewId)) S.previewId = null;
  }
  function undo() { if (!S.undo.length) return; S.redo.push(JSON.stringify(S.boards)); restore(S.undo.pop()); S.undoKey = null; renderAll(); }
  function redo() { if (!S.redo.length) return; S.undo.push(JSON.stringify(S.boards)); restore(S.redo.pop()); S.undoKey = null; renderAll(); }

  /* ------------------------------------------------------------------
     Model helpers
     ------------------------------------------------------------------ */
  function groupNames() {
    const set = new Set();
    for (const b of S.boards) for (const l of b.links) if (l.group && l.group.trim()) set.add(l.group.trim());
    return [...set];
  }
  const groupIndex = (name) => Math.max(0, groupNames().indexOf((name || '').trim()));
  const gVars = (name) => { const i = groupIndex(name) % 6; return `--gc: var(--g${i}); --gsoft: var(--g${i}-soft);`; };
  const gColor = (name) => `var(--g${groupIndex(name) % 6})`;

  function groupTabs() {
    const map = new Map();
    for (const b of S.boards) {
      const byId = Object.fromEntries(b.notes.map((n) => [n.id, n]));
      for (const l of b.links) {
        const g = (l.group || '').trim();
        if (!g) continue;
        const s = byId[l.src], d = byId[l.dst];
        if (!s || !d) continue;
        if (!map.has(g)) map.set(g, { notes: new Map(), links: [], desks: new Set() });
        const e = map.get(g);
        e.notes.set(s.id, s); e.notes.set(d.id, d); e.links.push(l); e.desks.add(b.title);
      }
    }
    return [...map.entries()].map(([name, e]) => {
      const id = 'group:' + name;
      const v = S.groupViews[id] || (S.groupViews[id] = { zoom: 1, panX: 0, panY: 0, fresh: true });
      return { id, title: name, isGroup: true, groupName: name, notes: [...e.notes.values()], links: e.links, desks: [...e.desks], viewMode: v.viewMode || 'freeform', strokes: v.strokes || (v.strokes = []), view: v };
    });
  }
  function activeBoard() {
    if (String(S.activeId).startsWith('group:')) {
      const g = groupTabs().find((t) => t.id === S.activeId);
      if (g) return g;
      S.activeId = S.boards[0].id;
    }
    return S.boards.find((b) => b.id === S.activeId) || S.boards[0];
  }
  const viewOf = (board) => (board.isGroup ? board.view : board);
  const homeBoard = () => { const b = activeBoard(); return b.isGroup ? S.boards[0] : b; };
  function findNote(id) { for (const b of S.boards) { const n = b.notes.find((x) => x.id === id); if (n) return n; } return null; }
  function ownerBoard(id) { return S.boards.find((b) => b.notes.some((n) => n.id === id)); }
  function linksFor(id) { const out = []; for (const b of S.boards) for (const l of b.links) if (l.src === id || l.dst === id) out.push(l); return out; }
  function visibleNotes(board = activeBoard()) {
    const q = S.search.trim().toLowerCase();
    return board.notes.filter((n) => {
      if (S.badgeFilter && !n.badges.includes(S.badgeFilter)) return false;
      if (S.typeFilter && n.type !== S.typeFilter) return false;
      if (!q) return true;
      return [n.title, n.body, TYPES[n.type].label, ...n.tasks.map((t) => t.title), ...n.badges.map((b) => B[b]?.label || '')].join(' ').toLowerCase().includes(q);
    });
  }

  function addNote(o, { edit = false } = {}) {
    pushUndo();
    const board = homeBoard();
    const c = viewCenter();
    const note = Object.assign({
      id: uid('n'), type: 'text', title: '', body: '', url: '', badges: [], tasks: [], meta: {}, scribbles: [],
      x: Math.round(c.x - 130), y: Math.round(c.y - 80), w: 260, h: 150, rev: 1, refreshedAt: Date.now(), createdAt: Date.now(), progress: 0,
    }, o);
    note.x = Math.round(note.x); note.y = Math.round(note.y);
    Object.assign(note, freeSpot(board.notes, note));
    board.notes.push(note);
    const act = activeBoard();
    if (act.isGroup && act.notes.length) {
      board.links.push({ id: uid('l'), src: act.notes[0].id, dst: note.id, group: act.groupName, label: 'added to group' });
    }
    S.sel = note.id;
    if (edit) S.editingId = note.id;
    renderAll();
    if (activeBoard().viewMode === 'freeform') requestAnimationFrame(() => reveal(note));
    else toast(`Added to ${board.title}`, true);
    return note;
  }
  /** Nearest position around (x, y) where a note of this size overlaps nothing. */
  function freeSpot(notes, { x, y, w, h }) {
    const gap = 24;
    const hits = (px, py) => notes.some((n) => px < n.x + n.w + gap && px + w + gap > n.x && py < n.y + n.h + gap && py + h + gap > n.y);
    if (!hits(x, y)) return { x, y };
    for (let r = 1; r < 40; r++) {
      for (let i = -r; i <= r; i++) {
        for (const [dx, dy] of [[i, -r], [i, r], [-r, i], [r, i]]) {
          const px = x + dx * 48, py = y + dy * 48;
          if (!hits(px, py)) return { x: Math.round(px / 8) * 8, y: Math.round(py / 8) * 8 };
        }
      }
    }
    return { x, y };
  }

  function deleteNote(id) {
    pushUndo();
    for (const b of S.boards) { b.notes = b.notes.filter((n) => n.id !== id); b.links = b.links.filter((l) => l.src !== id && l.dst !== id); }
    if (S.sel === id) S.sel = null;
    if (S.previewId === id) S.previewId = null;
    if (S.maxId === id) S.maxId = null;
    renderAll();
    toast('Note deleted', true);
  }
  function deleteNotes(ids) {
    const gone = new Set(ids); if (!gone.size) return;
    pushUndo();
    for (const b of S.boards) { b.notes = b.notes.filter((n) => !gone.has(n.id)); b.links = b.links.filter((l) => !gone.has(l.src) && !gone.has(l.dst)); }
    if (gone.has(S.sel)) S.sel = null;
    S.multi.clear();
    renderAll();
    toast(gone.size === 1 ? 'Note deleted' : `${gone.size} notes deleted`, true);
  }
  function toggleBadge(id, badge, force) {
    const n = findNote(id); if (!n) return;
    const has = n.badges.includes(badge);
    if (force === true && has) return;
    pushUndo();
    n.badges = has ? n.badges.filter((b) => b !== badge) : [...n.badges, badge];
    renderAll();
  }
  function createLink(src, dst, group, label = '') {
    if (src === dst) return;
    pushUndo();
    const g = (group || '').trim() || 'Linked cluster';
    S.linkGroup = g;
    const board = S.boards.find((b) => b.notes.some((n) => n.id === src) && b.notes.some((n) => n.id === dst)) || ownerBoard(src) || S.boards[0];
    const existing = board.links.find((l) => (l.src === src && l.dst === dst) || (l.src === dst && l.dst === src));
    if (existing) { existing.group = g; if (label) existing.label = label; }
    else board.links.push({ id: uid('l'), src, dst, group: g, label });
    renderAll();
    toast(`Linked in “${g}”`, true);
  }
  function viewCenter() {
    const vp = $('#viewport').getBoundingClientRect();
    const v = viewOf(activeBoard());
    return { x: (vp.width / 2 - v.panX) / v.zoom, y: ((vp.height - railInset()) / 2 - v.panY) / v.zoom };
  }
  const railInset = () => (isPhone() ? 96 : 84);
  const tasksDone = (n) => n.tasks.filter((t) => t.done).length;
  function shortAgo(t) { const m = Math.floor((Date.now() - t) / 60000); if (m < 1) return 'now'; if (m < 60) return m + 'm'; const h = Math.floor(m / 60); return h < 24 ? h + 'h' : Math.floor(h / 24) + 'd'; }
  function timeAgo(t) { const m = Math.floor((Date.now() - t) / 60000); if (m < 1) return 'just now'; if (m < 60) return m + ' min ago'; const h = Math.floor(m / 60); return h < 24 ? h + ' h ago' : Math.floor(h / 24) + ' d ago'; }
  const host = (u) => { try { const x = new URL(u); return x.host + (x.pathname.length > 1 ? x.pathname : ''); } catch { return u || ''; } };
  const emailOf = (n) => n.meta.sender || ((n.url || n.body).match(/[\w.\-]+@[\w.\-]+\w/) || [''])[0];
  const nameFromEmail = (e) => e.replace('mailto:', '').split('@')[0].split(/[.\s_\-]+/).filter(Boolean).map((p) => p[0].toUpperCase() + p.slice(1)).join(' ');
  const initials = (e) => { const p = e.split('@')[0].split(/[.\s_\-]+/).filter(Boolean); return p.length > 1 ? (p[0][0] + p[1][0]).toUpperCase() : (p[0] || '?')[0].toUpperCase(); };
  const fileName = (u) => (u || '').split(/[\\/]/).pop();

  /* ------------------------------------------------------------------
     Rendering — chrome
     ------------------------------------------------------------------ */
  function renderAll({ preview = true } = {}) {
    document.documentElement.dataset.theme = S.theme;
    renderTopbar();
    renderGroupBar();
    renderMain();
    renderRail();
    if (preview) renderViewers();
    save();
  }

  function renderTopbar() {
    const board = activeBoard();
    const users = S.boards, groups = groupTabs();
    const tab = (b, isGroup) => `<button class="tab ${isGroup ? 'group' : ''}" data-tab="${esc(b.id)}" ${b.id === board.id ? 'aria-current="page"' : ''} style="${isGroup ? gVars(b.groupName) : ''}" ${isGroup ? '' : 'title="Right-click to rename or close"'}>${isGroup ? '<span class="gdot"></span>' : ''}${esc(b.title)}<span class="count">${b.notes.length}</span></button>`;
    $('#tabs').innerHTML = users.map((b) => tab(b, false)).join('') +
      (groups.length ? '<div class="vdiv" style="height:18px;margin:0 6px"></div>' : '') +
      groups.map((g) => tab(g, true)).join('') +
      `<button class="ib sm" id="new-desk" aria-label="New desk" title="New desk">${icon('plus', 's16')}</button>`;
    $('#desk-switch-label').textContent = board.title;
    const group = viewGroup(board.viewMode);
    $$('.topbar .seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.view === group)));
    const tidy = $('#tidy-btn');
    tidy.style.display = board.viewMode === 'freeform' && !board.isGroup ? '' : 'none';
    tidy.classList.toggle('active', !!board.tidy);
    tidy.querySelector('.tidy-label').textContent = board.tidy ? 'Undo tidy' : 'Tidy up';
    tidy.title = board.tidy ? 'Put notes back where you left them' : 'Arrange notes in a tidy grid (reversible)';
    $('#sync-label').textContent = window.PaperDeskSync ? window.PaperDeskSync.label() : 'This device';
    $('#theme-btn').innerHTML = icon(S.theme === 'dark' ? 'sun' : 'moon');
    $('#theme-btn').setAttribute('aria-label', S.theme === 'dark' ? 'Switch to warm paper' : 'Switch to dark slate');
    $('#theme-btn').title = $('#theme-btn').getAttribute('aria-label');
    const vt = $('#view-toggle-phone');
    vt.innerHTML = icon(board.viewMode === 'freeform' ? 'list' : 'canvas', 's20');
    vt.setAttribute('aria-label', board.viewMode === 'freeform' ? 'Switch to list view' : 'Switch to canvas view');
    $('#search-kbd').textContent = MOD + 'K';
  }

  function renderGroupBar() {
    const board = activeBoard();
    const bar = $('#group-bar');

  }

  const viewGroup = (m) => (m === 'freeform' ? 'canvas' : ['gallery', 'symmetricalGrid', 'asymmetricalGrid'].includes(m) ? 'grid' : 'list');
  function setViewGroup(g) {
    const board = activeBoard();
    if (viewGroup(board.viewMode) === g) return;
    const v = viewOf(board);
    v.viewMode = g === 'canvas' ? 'freeform' : g === 'grid' ? 'symmetricalGrid' : 'detailsList';
    if (board.isGroup) board.viewMode = v.viewMode;
    renderAll();
  }

  function renderMain() {
    const board = activeBoard();
    const canvas = board.viewMode === 'freeform';
    $('#viewport').style.display = canvas ? '' : 'none';
    $('#structured').classList.toggle('show', !canvas);
    $('#history').style.display = canvas ? '' : 'none';
    $('#zoombox').style.display = canvas ? '' : 'none';

    $('#rail-wrap').style.display = canvas ? '' : 'none';
    $('#fab').classList.toggle('show', !canvas);

  }

  /* ------------------------------------------------------------------
     Rendering — canvas
     ------------------------------------------------------------------ */
  function noteContext(n) {
    switch (n.type) {
      case 'checklist': return n.tasks.length ? `${tasksDone(n)}/${n.tasks.length}` : '';
      case 'webPreview': return `v${n.rev || 1} · ${shortAgo(n.refreshedAt || Date.now())}`;
      case 'voice': case 'audio': case 'video': return n.meta.duration || '';
      case 'pdf': return n.meta.pages || '';
      case 'fileAttachment': return n.meta.size || n.meta.fileSize || '';
      case 'alarm': return (n.meta.alarmTime || '').replace(/\d{1,2}:\d{2}/, '').trim();
      default: return '';
    }
  }
  const WAVE = [.22, .36, .57, .43, .71, .86, .5, .29, .64, .93, .71, .43, .29, .57, .79, 1, .64, .36, .22, .43, .64, .86, .57, .36, .5, .71, .43, .29, .22, .36];
  function waveHtml(n) {
    const count = Math.max(10, Math.floor((n.w - 24 - 42) / 5));

    return Array.from({ length: count }, (_, i) => `<i class="${i < played ? 'on' : ''}" style="height:${Math.max(3, Math.round(28 * WAVE[i % WAVE.length]))}px"></i>`).join('');
  }
  function chipHtml(id, extra = '') { const b = B[id]; return `<span class="chip t-${b.tone} ${extra}">${icon(b.icon, 's12')}${esc(b.label)}</span>`; }

  function typeBody(n) {

      case 'checklist':
        return `<div>${n.tasks.map((t, i) => `<label class="task ${t.done ? 'done' : ''}"><input type="checkbox" data-task="${i}" ${t.done ? 'checked' : ''}/><span>${esc(t.title)}</span></label>`).join('')}</div>`;
      case 'webPreview':
        return `<div class="thumb web"><div class="dots"><i></i><i></i><i></i></div><div class="bar h"></div><div class="bar" style="width:90%"></div><div class="bar" style="width:84%"></div><div class="cells"><i></i><i></i><i></i></div></div><div class="monoline">${esc(host(n.url || n.body))}</div>`;
      case 'voice': case 'audio':
        return `<div class="player"><button class="play" data-play aria-label="${n.playing ? 'Pause' : 'Play'}">${icon(n.playing ? 'pause' : 'play', 'fill s14')}</button><div class="wave" aria-hidden="true">${waveHtml(n)}</div></div><div class="body ${n.type === 'voice' ? 'italic' : ''}">${esc(n.body)}</div>`;
      case 'pdf': case 'fileAttachment': {

      }
      case 'video':
        return `<div class="thumb video"><button class="playbig" data-play aria-label="${n.playing ? 'Pause' : 'Play'}">${icon(n.playing ? 'pause' : 'play', 'fill s16')}</button>${m.duration ? `<span class="duration">${esc(m.duration)}</span>` : ''}</div><div class="sub">${esc(n.body)}</div>`;
      case 'screenClip':

      case 'emailLink': {
        const e = emailOf(n);

      }
      case 'invitation': {
        const r = (m.rsvp || '').match(/(\d+)\s*\/\s*(\d+)/);
        return `<div class="body" style="font-size:12.5px">${esc(n.body)}</div>${r ? `<div class="row" style="color:var(--ink-2);font-size:12.5px">${icon('users', 's16')}${r[1]} of ${r[2]} attending</div>` : ''}`;
      }
      case 'calendar': {

        return `<div class="row" style="align-items:flex-start">${d ? `<div class="datebox"><small>${mon}</small><b>${d.getDate()}</b></div>` : ''}<div class="body" style="font-size:12.5px">${esc(n.body)}</div></div>`;
      }
      case 'alarm': {

        return `<div class="row">${t ? `<span class="bigtime">${t}</span>` : ''}<span class="sub" style="white-space:normal">${esc(n.body)}</span></div>`;
      }
      case 'appShortcut':
        return `<div class="monoline">${esc(n.url || n.body)}</div><div><button class="btn" data-launch style="height:30px;font-size:12.5px">${icon('external', 's14')}Launch</button></div>`;
      case 'hyperlink': case 'bookmark':
        return `${n.url ? `<div class="monoline">${esc(host(n.url))}</div>` : ''}<div class="body" style="font-size:12.5px">${esc(n.body === n.url ? '' : n.body)}</div>`;
      default:
        return `<div class="body">${esc(n.body)}</div>`;
    }
  }

  function noteHtml(n) {
    const t = TYPES[n.type] || TYPES.text;
    const editing = S.editingId === n.id;
    const pinned = n.badges.includes('pin');
    const cls = ['note', (S.sel === n.id || S.multi.has(n.id)) ? 'selected' : '', editing ? 'editing' : '', S.pendingLink === n.id ? 'link-source' : ''].join(' ');
    const chips = n.badges.filter((b) => B[b]?.kind === 'chip');
    const ctx = noteContext(n);
    const label = `${t.label}: ${n.title || 'Untitled'}${n.badges.length ? '. Badges: ' + n.badges.map((b) => B[b]?.label).join(', ') : ''}`;
    const meta = `<div class="meta">${icon(t.icon, 's14')}<span class="type">${t.label}</span>${editing ? '<span>Esc to finish</span>' : `${ctx ? `<span class="ctx">${esc(ctx)}</span>` : ''}${n.type === 'webPreview' ? `<button class="mini" data-refresh aria-label="Refresh snapshot" title="Refresh snapshot">${icon('refresh', 's14')}</button>` : ''}<button class="mini max" data-max aria-label="Expand to canvas" title="Expand to canvas (F)">${icon('expand', 's14')}</button>${n.badges.includes('star') ? `<span class="star" title="Starred">${icon('star', 'fill s14')}</span>` : ''}${pinned ? `<span title="Pinned — position locked">${icon('pin', 's14')}</span>` : ''}${pinned ? '' : `<span class="grip">${icon('grip', 's14')}</span>`}`}</div>`;
    const inner = editing
      ? `${meta}<input class="edit-title" value="${esc(n.title)}" placeholder="Title" aria-label="Title"/><textarea class="edit-body" placeholder="Write anything…" aria-label="Note text">${esc(n.body)}</textarea>`
