    <rect x="34" y="42" width="116" height="24" rx="12" fill="#2D55D9"/>
    <rect x="34" y="100" width="172" height="16" rx="8" fill="#C9D3F5"/>
    <rect x="34" y="130" width="156" height="16" rx="8" fill="#C9D3F5"/>
    <rect x="34" y="160" width="134" height="16" rx="8" fill="#C9D3F5"/>
