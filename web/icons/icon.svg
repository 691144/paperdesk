<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse" x="0" y="0">
      <circle cx="20" cy="20" r="3" fill="#fff" fill-opacity=".15"/>
    </pattern>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
