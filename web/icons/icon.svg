  <g transform="translate(222 236) rotate(-9) translate(-116.0 -116.0)" filter="url(#sh)">
    <rect width="232" height="232" rx="24" fill="#FFD66B"/>
    <rect x="30" y="46" width="140" height="16" rx="8" fill="#E8B84A"/>
    <rect x="30" y="76" width="110" height="16" rx="8" fill="#E8B84A"/>
